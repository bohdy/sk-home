name: OpenTofu

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
      - ".github/workflows/terraform-pr-validation.yaml"
      - ".github/workflows/routeros-firewall-inventory.yaml"
      - "mise.toml"
      - ".pre-commit-config.yaml"

# PR validation executes repository-controlled configuration without access to
# remote state, infrastructure endpoints, Bitwarden, or GitHub write scopes.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tofu-pr-validate:
    # Preserve the existing matrix check context while this job performs only
    # credential-free validation rather than a remote-state plan.
    name: OpenTofu plan
    # Use an ephemeral hosted runner because the matrix evaluates code supplied
    # by an untrusted pull request and must not share the production runner.
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        stacks: [network/gw/interfaces, network/gw/dhcp, k3s/talos-cluster, cloudflare/tunnel]

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      # Prevent accidental SDK metadata discovery if a provider or backend
      # ignores the intentionally disabled remote backend.
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Fail if infrastructure credentials are present
        shell: bash
        run: |
          set -euo pipefail

          for variable in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            BWS_ACCESS_TOKEN \
            MIKROTIK_USERNAME \
            MIKROTIK_PASSWORD \
            KUBERNETES_BGP_TCP_MD5_KEY \
            SNMP_V2_COMMUNITY \
            SNMP_V3_USERNAME \
            SNMP_V3_AUTH_PASSWORD \
            SNMP_V3_PRIV_PASSWORD \
            PROXMOX_VE_ENDPOINT \
            PROXMOX_VE_API_TOKEN \
            PROXMOX_VE_SSH_USERNAME \
            PROXMOX_SSH_PRIVATE_KEY \
            PROXMOX_EXPORTER_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            GRAFANA_ACCESS_EMAIL \
            TF_VAR_mikrotik_username \
            TF_VAR_mikrotik_password \
            TF_VAR_kubernetes_bgp_tcp_md5_key \
            TF_VAR_snmp_v2_community \
            TF_VAR_snmp_v3_username \
            TF_VAR_snmp_v3_auth_password \
            TF_VAR_snmp_v3_priv_password \
            TF_VAR_proxmox_endpoint \
            TF_VAR_proxmox_api_token \
            TF_VAR_proxmox_ssh_username \
            TF_VAR_proxmox_ssh_private_key \
            TF_VAR_cloudflare_account_id \
            TF_VAR_cloudflare_api_token; do
            if [[ -n "${!variable:-}" ]]; then
              echo "PR validation received an unexpected infrastructure credential: ${variable}" >&2
              exit 1
            fi
          done

      - name: OpenTofu format check
        run: tofu fmt -recursive -check -diff

      - name: OpenTofu init without backend
        run: tofu -chdir=terraform/${{ matrix.stacks }} init -backend=false -input=false

      - name: OpenTofu validate
        run: tofu -chdir=terraform/${{ matrix.stacks }} validate -no-color
