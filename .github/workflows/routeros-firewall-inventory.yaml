name: RouterOS firewall inventory

on:
  workflow_dispatch:

# This workflow is read-only and trusted-only. It records a sanitized RouterOS
# baseline before firewall policy values or rule ordering are changed.
permissions:
  contents: read

concurrency:
  group: routeros-firewall-inventory
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate trusted inventory ref
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "RouterOS inventory must run from the main branch." >&2
            exit 1
          fi

  inventory:
    name: Capture sanitized firewall baseline
    runs-on: self-hosted
    needs: validate-ref
    if: needs.validate-ref.result == 'success'

    steps:
      - name: Get RouterOS automation credentials
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD

      - name: Capture RouterOS metadata
        shell: bash
        env:
          ROUTEROS_URL: https://gw.bohdal.name
        run: |
          set -euo pipefail

          # Keep the raw API responses off logs and project only fields needed
          # to review policy. WireGuard private and preshared keys are never
          # requested into the resulting baseline document.
          baseline_dir="${RUNNER_TEMP}/routeros-firewall-baseline-${GITHUB_RUN_ID}"
          mkdir -p "${baseline_dir}"

          collect() {
            local path="$1"
            curl --fail --silent --show-error --insecure --retry 2 \
              --user "${MIKROTIK_USERNAME}:${MIKROTIK_PASSWORD}" \
              "${ROUTEROS_URL}${path}"
          }

          collect /rest/ip/firewall/filter | jq -ce '[.[] | {
            id: .[".id"],
            chain,
            action,
            comment,
            disabled,
            dynamic,
            invalid,
            connection_state: .["connection-state"],
            src_address: .["src-address"],
            src_address_list: .["src-address-list"],
            dst_address: .["dst-address"],
            dst_address_list: .["dst-address-list"],
            protocol,
            src_port: .["src-port"],
            dst_port: .["dst-port"],
            in_interface: .["in-interface"],
            in_interface_list: .["in-interface-list"],
            out_interface: .["out-interface"],
            out_interface_list: .["out-interface-list"]
          }]' > "${baseline_dir}/filters.json"

          collect /rest/ip/firewall/address-list | jq -ce '[.[] | {
            id: .[".id"],
            list,
            address,
            comment,
            disabled,
            dynamic,
            timeout
          }]' > "${baseline_dir}/address-lists.json"

          collect /rest/interface/list | jq -ce '[.[] | {
            id: .[".id"],
            name,
            comment,
            builtin,
            dynamic
          }]' > "${baseline_dir}/interface-lists.json"

          collect /rest/interface/list/member | jq -ce '[.[] | {
            id: .[".id"],
            list,
            interface,
            comment,
            dynamic
          }]' > "${baseline_dir}/interface-list-members.json"

          collect /rest/interface | jq -ce '[.[] | {
            id: .[".id"],
            name,
            type,
            comment,
            disabled,
            running
          }]' > "${baseline_dir}/interfaces.json"

          collect /rest/ip/address | jq -ce '[.[] | {
            id: .[".id"],
            address,
            network,
            interface,
            comment,
            disabled,
            dynamic
          }]' > "${baseline_dir}/ip-addresses.json"

          collect /rest/ip/route | jq -ce '[.[] | {
            id: .[".id"],
            dst_address: .["dst-address"],
            gateway,
            interface,
            active,
            disabled,
            comment
          }]' > "${baseline_dir}/routes.json"

          collect /rest/interface/wireguard | jq -ce '[.[] | {
            id: .[".id"],
            name,
            listen_port: .["listen-port"],
            mtu,
            disabled,
            comment
          }]' > "${baseline_dir}/wireguard-interfaces.json"

          collect /rest/interface/wireguard/peers | jq -ce '[.[] | {
            id: .[".id"],
            interface,
            public_key: .["public-key"],
            allowed_address: .["allowed-address"],
            endpoint_address: .["endpoint-address"],
            endpoint_port: .["endpoint-port"],
            persistent_keepalive: .["persistent-keepalive"],
            last_handshake: .["last-handshake"],
            preshared_key_configured: ((.["preshared-key"] // "") | length > 0),
            disabled,
            comment
          }]' > "${baseline_dir}/wireguard-peers.json"

          collect /rest/ip/service | jq -ce '[.[] | {
            id: .[".id"],
            name,
            port,
            address,
            disabled,
            invalid,
            certificate,
            vrf
          }]' > "${baseline_dir}/services.json"

          collect /rest/ip/firewall/nat | jq -ce '[.[] | {
            id: .[".id"],
            chain,
            action,
            comment,
            disabled,
            src_address: .["src-address"],
            dst_address: .["dst-address"],
            protocol,
            src_port: .["src-port"],
            dst_port: .["dst-port"],
            in_interface_list: .["in-interface-list"],
            out_interface_list: .["out-interface-list"]
          }]' > "${baseline_dir}/nat.json"

          jq -n \
            --slurpfile filters "${baseline_dir}/filters.json" \
            --slurpfile address_lists "${baseline_dir}/address-lists.json" \
            --slurpfile interface_lists "${baseline_dir}/interface-lists.json" \
            --slurpfile interface_list_members "${baseline_dir}/interface-list-members.json" \
            --slurpfile interfaces "${baseline_dir}/interfaces.json" \
            --slurpfile ip_addresses "${baseline_dir}/ip-addresses.json" \
            --slurpfile routes "${baseline_dir}/routes.json" \
            --slurpfile wireguard_interfaces "${baseline_dir}/wireguard-interfaces.json" \
            --slurpfile wireguard_peers "${baseline_dir}/wireguard-peers.json" \
            --slurpfile services "${baseline_dir}/services.json" \
            --slurpfile nat "${baseline_dir}/nat.json" \
            '{
              filters: $filters[0],
              address_lists: $address_lists[0],
              interface_lists: $interface_lists[0],
              interface_list_members: $interface_list_members[0],
              interfaces: $interfaces[0],
              ip_addresses: $ip_addresses[0],
              routes: $routes[0],
              wireguard_interfaces: $wireguard_interfaces[0],
              wireguard_peers: $wireguard_peers[0],
              services: $services[0],
              nat: $nat[0]
            }' > "${baseline_dir}/routeros-firewall-baseline.json"

          {
            echo "### RouterOS firewall baseline"
            jq -r '
              "- Filter rules: \(.filters | length)",
              "- Address-list entries: \(.address_lists | length)",
              "- Interface lists: \(.interface_lists | length)",
              "- Interface-list members: \(.interface_list_members | length)",
              "- IPv4 addresses: \(.ip_addresses | length)",
              "- Routes: \(.routes | length)",
              "- WireGuard interfaces: \(.wireguard_interfaces | length)",
              "- WireGuard peers: \(.wireguard_peers | length)",
              "- RouterOS services: \(.services | length)",
              "- NAT rules: \(.nat | length)"
            ' "${baseline_dir}/routeros-firewall-baseline.json"
            echo
            echo "#### Filter order"
            jq -r '.filters[] | "- `\(.id)` [\(.chain)] \(.action) \(.comment // "")"' \
              "${baseline_dir}/routeros-firewall-baseline.json"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "ROUTEROS_FIREWALL_BASELINE=${baseline_dir}/routeros-firewall-baseline.json" >> "${GITHUB_ENV}"

      - name: Upload sanitized firewall baseline
        uses: actions/upload-artifact@v7
        with:
          name: routeros-firewall-baseline
          path: ${{ env.ROUTEROS_FIREWALL_BASELINE }}
          if-no-files-found: error
          retention-days: 30
