name: Manifest validation

on:
  pull_request:
  push:
    branches:
      - main

# Validation only needs to read the repository and does not receive secrets.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate manifests and repository hygiene
    # Keep PR-controlled hooks off the shared infrastructure runner while
    # retaining the existing runner for trusted main-branch validation.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      # Use the repository-pinned kubectl, OpenTofu, and pre-commit versions.
      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          # Pin a published release so validation does not follow a stale latest pointer.
          version: 2026.9.2
          install: true

      - name: Run repository hooks
        run: pre-commit run --all-files

      - name: Confirm hooks left a clean checkout
        run: git diff --exit-code

      - name: Validate rendered manifests and scripts
        shell: bash
        run: |
          set -euo pipefail

          # Synthetic tests never retrieve credentials or invoke live bootstrap.
          python3 scripts/test-shared-postgres-bootstrap.py
          bash scripts/shared-postgres-render.sh
          python3 scripts/render-dns.py --check
          kubectl kustomize kubernetes/flux/infrastructure/dns/rendered >/dev/null
          kubectl kustomize kubernetes/flux/infrastructure/certificates >/dev/null
          kubectl kustomize kubernetes/flux/infrastructure/nas-tls/issue >/dev/null
          kubectl kustomize kubernetes/flux/infrastructure/nas-tls/bootstrap >/dev/null
          kubectl kustomize kubernetes/flux/infrastructure/nas-tls/delivery >/dev/null
          kubectl kustomize kubernetes/flux/apps/smtp-relay >/dev/null
          kubectl kustomize kubernetes/flux/apps/second-brain >/dev/null
          kubectl kustomize kubernetes/flux/clusters/sk-talos/apps >/dev/null
          kubectl kustomize kubernetes/flux/clusters/sk-talos >/dev/null
          kubectl kustomize kubernetes/flux/observability/alerting >/dev/null
          kubectl kustomize kubernetes/flux/observability/blackbox >/dev/null
          kubectl kustomize kubernetes/flux/observability/nas-tls >/dev/null
          kubectl kustomize kubernetes/flux/observability/flow-collector >/dev/null
          kubectl kustomize kubernetes/flux/observability/flow-geoip >/dev/null
          kubectl kustomize kubernetes/flux/clusters/sk-talos/observability >/dev/null
          bash -n .devcontainer/post-create.sh scripts/smtp-relay-preflight.sh scripts/shared-postgres-render.sh
          sh -n kubernetes/flux/observability/flow-geoip/geoip-refresh.sh
          jq empty kubernetes/flux/observability/dashboards/sk-flow.json
          python3 -m unittest discover -s tests -p 'test_nas_tls*.py'
