            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Plan gateway firewall resources
        run: >-
          tofu -chdir=terraform/${{ env.STACK_PATH }} plan
          -target=routeros_interface_list.lists
          -target=routeros_interface_list_member.list_member_internal_vlan
          -target=routeros_ip_firewall_addr_list.adopted
          -target=routeros_ip_firewall_addr_list.internal_networks
          -target=routeros_ip_firewall_addr_list.kubernetes_bgp_peers
          -target=routeros_ip_firewall_addr_list.management_sources
          -target=routeros_ip_firewall_addr_list.kubernetes_service_vips
          -target=routeros_ip_firewall_filter.adopted_input
          -target=routeros_ip_firewall_filter.adopted_forward
          -target=routeros_ip_firewall_nat.adopted
          -target=routeros_ip_firewall_raw.adopted
          -target=routeros_ip_firewall_mangle.adopted
          -target=routeros_ipv6_firewall_addr_list.adopted
          -target=routeros_ipv6_firewall_filter.adopted
          -target=routeros_ipv6_firewall_nat.adopted
          -target=routeros_ipv6_firewall_mangle.adopted
          -target=terraform_data.raw_ownership
          -target=terraform_data.bridge_filter_ownership
          -target=terraform_data.ip_mangle_ownership
          -target=terraform_data.ipv6_nat_ownership
          -target=terraform_data.ipv6_mangle_ownership
          -target=routeros_ip_firewall_filter.input_accept_established
          -target=routeros_ip_firewall_filter.input_drop_invalid
          -target=routeros_ip_firewall_filter.input_allow_icmp_trusted
          -target=routeros_ip_firewall_filter.input_allow_loopback
          -target=routeros_ip_firewall_filter.input_allow_dhcp
          -target=routeros_ip_firewall_filter.input_allow_dns_udp
          -target=routeros_ip_firewall_filter.input_allow_dns_tcp
          -target=routeros_ip_firewall_filter.input_allow_ipsec_esp
          -target=routeros_ip_firewall_filter.input_allow_ipsec_handshake
          -target=routeros_ip_firewall_filter.input_allow_kubernetes_bgp
          -target=routeros_ip_firewall_filter.input_allow_snmp_monitoring
          -target=routeros_ip_firewall_filter.input_allow_management
          -target=routeros_ip_firewall_filter.input_drop_unmatched
          -target=routeros_ip_firewall_filter.forward_fasttrack_established
          -target=routeros_ip_firewall_filter.forward_accept_established
          -target=routeros_ip_firewall_filter.forward_drop_invalid
          -target=routeros_ip_firewall_filter.forward_allow_ipsec_in
          -target=routeros_ip_firewall_filter.forward_allow_ipsec_out
          -target=routeros_ip_firewall_filter.forward_allow_trusted_lan_to_wan
          -target=routeros_ip_firewall_filter.forward_allow_synology_from_vlans
          -target=routeros_ip_firewall_filter.forward_allow_kubernetes_service_vips
          -target=routeros_ip_firewall_filter.forward_allow_wireguard_kubernetes_dns_udp
          -target=routeros_ip_firewall_filter.forward_allow_wireguard_kubernetes_dns_tcp
          -target=routeros_ip_firewall_filter.forward_allow_smtp_relay_from_printer
          -target=routeros_ip_firewall_filter.allow_kubernetes_synology_snmp
          -target=routeros_ip_firewall_filter.allow_synology_snmp_responses
          -target=routeros_ip_firewall_filter.allow_kubernetes_unifi_snmp
          -target=routeros_ip_firewall_filter.allow_unifi_snmp_responses
          -target=routeros_ip_firewall_filter.allow_kubernetes_proxmox
          -target=routeros_ip_firewall_filter.forward_management
          -target=routeros_ip_firewall_filter.forward_allow_wan_dstnat
          -target=routeros_ip_firewall_filter.forward_drop_inter_vlan
          -target=routeros_ip_firewall_filter.forward_drop_wan_inbound
          -target=routeros_ip_firewall_filter.forward_drop_unmatched
          -target=routeros_move_items.input_rules
          -target=routeros_move_items.forward_rules
          -target=routeros_move_items.nat_rules
          -target=routeros_move_items.ipv6_filter_rules
          -out=firewall-tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Reject destructive firewall plan
        shell: bash
        run: |
          set -euo pipefail

          if ! tofu -chdir=terraform/${{ env.STACK_PATH }} show -json firewall-tofuplan \
            | jq -e 'all(.resource_changes[]?.change.actions; index("delete") == null)' >/dev/null; then
            echo "The firewall plan contains a delete or replacement; refusing to upload it." >&2
            exit 1
          fi

      - name: Upload gateway firewall plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}/firewall-tofuplan
          if-no-files-found: error
          retention-days: 7

  gateway-firewall-apply:
    name: Apply gateway firewall policy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: [validate-dispatch, gateway-firewall-plan]
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-firewall-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Download gateway firewall plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}

      - name: Get gateway firewall secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Apply gateway firewall plan
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} apply -auto-approve firewall-tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

  gateway-qdevice-plan:
    name: Plan RouterOS qnetd quorum device
    # Keep the USB-backed qnetd attachment isolated from provider-sensitive
    # gateway resources. This initial plan is read-only on RouterOS; an apply
    # dispatch continues through the separately gated native recovery job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.apply_gateway_qdevice || inputs.plan_gateway_qdevice) && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_proxmox && !inputs.plan_gateway_proxmox && !inputs.apply_gateway_ether7 && !inputs.plan_gateway_ether7 && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: validate-dispatch

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-qdevice-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Get gateway qdevice secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: Set qdevice authorized public key
        shell: bash
        run: |
          set -euo pipefail

          public_key_file="terraform/${STACK_PATH}/qdevice-authorized.pub"
          expected_fingerprint="SHA256:9x+cumin8611j5uKUYwq2kTRI6nVbTtxF9GoeISjeF8"
          public_key="$(tr -d '\r\n' < "${public_key_file}")"
          actual_fingerprint="$(ssh-keygen -lf "${public_key_file}" | awk '{print $2}')"
          [[ "${actual_fingerprint}" == "${expected_fingerprint}" ]]
          qdevice_json="$(jq -cn --arg key "${public_key}" '{enabled:true,ssh_public_key:$key}')"
          printf 'TF_VAR_qdevice=%s\n' "${qdevice_json}" >> "${GITHUB_ENV}"

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Derive qdevice desired state for preflight
        shell: bash
        run: |
          set -euo pipefail

          # Evaluate the state-only qdevice records without refreshing or
          # mutating RouterOS. The live preflight below consumes these values
          # so USB checks and global-path checks cannot drift from qdevice.tf.
          tofu -chdir=terraform/${STACK_PATH} plan \
            -refresh=false \
            -target=terraform_data.qdevice_mounts[0] \
            -target=terraform_data.qdevice_container[0] \
            -out=qdevice-desired-tofuplan
          tofu -chdir=terraform/${STACK_PATH} show -json qdevice-desired-tofuplan |
            jq -ce '
              [
                .planned_values.root_module.resources[]?
                | select(
                    .address == "terraform_data.qdevice_mounts[0]"
                    or .address == "terraform_data.qdevice_container[0]"
                  )
                | {address, input: .values.input}
              ] as $records
              | if ($records | length) != 2
                or (($records | map(.address) | sort) != [
                  "terraform_data.qdevice_container[0]",
                  "terraform_data.qdevice_mounts[0]"
                ]) then
                  error("qdevice desired-state records are missing")
                else
                  (reduce $records[] as $record ({}; .[$record.address] = $record.input)) as $desired
                  | {
                      mounts: $desired["terraform_data.qdevice_mounts[0]"],
                      container: $desired["terraform_data.qdevice_container[0]"]
                    }
                end
            ' > terraform/${STACK_PATH}/qdevice-desired.json
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Adopt existing qdevice network and container config
        shell: bash
        env:
          MIKROTIK_USERNAME: ${{ env.MIKROTIK_USERNAME }}
          MIKROTIK_PASSWORD: ${{ env.MIKROTIK_PASSWORD }}
          ROUTEROS_URL: https://10.1.100.1
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}
        run: |
          set -euo pipefail

          # Use curl's stdin configuration so credentials never appear in
          # process arguments, logs, or repository files.
          routeros_request() {
            local method="$1"
            local url="$2"
            local payload="${3-}"

            REQUEST_METHOD="$method" REQUEST_URL="$url" REQUEST_PAYLOAD="$payload" \
              jq -nr '
                "user = " + (($ENV.MIKROTIK_USERNAME + ":" + $ENV.MIKROTIK_PASSWORD) | @json),
                "url = " + ($ENV.REQUEST_URL | @json),
                "request = " + ($ENV.REQUEST_METHOD | @json),
                "insecure",
                "fail",
                "silent",
                "show-error",
                "header = " + ("Content-Type: application/json" | @json),
                (if ($ENV.REQUEST_PAYLOAD // "") == "" then empty else "data = " + ($ENV.REQUEST_PAYLOAD | @json) end)
              ' | curl --config -
          }

          qdevice_desired="$(jq -ce . terraform/${STACK_PATH}/qdevice-desired.json)"
          if ! jq -e '
            def safe_global_path:
              if type != "string" then false
              else test("^/usb1/[^/]+(/[^/]+)*$") and ((split("/") | index("..")) == null)
              end;
            . as $desired
            | if ($desired.mounts | type) != "object"
              or ($desired.container | type) != "object"
              or (($desired.mounts | length) != 3)
              or (($desired.container["remote-image"] | type) != "string")
              or (($desired.container.interface | type) != "string")
              or (($desired.container["root-dir"] | type) != "string")
              or (($desired.container.mountlists | type) != "array")
              or (($desired.container.mountlists | length) != 3)
              or (($desired.container.network | type) != "object")
              or (($desired.container.network.tagged | type) != "array")
              or (($desired.container.network.untagged | type) != "array")
              or (any($desired.container.network.tagged[]?; type != "string"))
              or (any($desired.container.network.untagged[]?; type != "string"))
              or (($desired.container.container_config | type) != "object")
              or (($desired.container.container_config.layer_dir | safe_global_path) | not)
              or (($desired.container.container_config.tmpdir | safe_global_path) | not)
              or (any($desired.mounts | to_entries[];
                ((.value | type) != "object")
                or ((.value.src | type) != "string")
                or ((.value.dst | type) != "string")
              )) then
                false
              else true
              end
          ' <<<"${qdevice_desired}" >/dev/null; then
            echo "The evaluated qdevice desired state is malformed or unsafe." >&2
            exit 1
          fi

          qdevice_mount_specs="$(jq -ce '.mounts | to_entries | map({list:.key,src:.value.src,dst:.value.dst})' <<<"${qdevice_desired}")"
          qdevice_container_spec="$(jq -ce '.container' <<<"${qdevice_desired}")"
          qdevice_image="$(jq -er '.container["remote-image"]' <<<"${qdevice_desired}")"
          qdevice_interface="$(jq -er '.container.interface' <<<"${qdevice_desired}")"
          qdevice_root_dir="$(jq -er '.container["root-dir"]' <<<"${qdevice_desired}")"
          qdevice_layer_dir="$(jq -er '.container.container_config.layer_dir' <<<"${qdevice_desired}")"
          qdevice_tmpdir="$(jq -er '.container.container_config.tmpdir' <<<"${qdevice_desired}")"
          qdevice_tagged="$(jq -ce '.container.network.tagged' <<<"${qdevice_desired}")"
          qdevice_untagged="$(jq -ce '.container.network.untagged' <<<"${qdevice_desired}")"
          required_paths="$(jq -ce '
            [
              .container["root-dir"],
              (.container["root-dir"] | split("/") | .[0:-1] | join("/")),
              (.container.container_config.layer_dir | sub("^/+"; "")),
              (.container.container_config.tmpdir | sub("^/+"; "")),
              (.mounts | to_entries[] | .value.src)
            ] | map(select((type == "string") and length > 0)) | unique
          ' <<<"${qdevice_desired}")"

          state_list="$(tofu -chdir=terraform/${STACK_PATH} state list)"
          if legacy_state="$(grep -E '^(routeros_container_mounts\.qdevice|routeros_container\.qdevice)' <<<"${state_list}")"; then
            echo "Legacy provider-managed qdevice mount/container state must be removed by a reviewed migration." >&2
            exit 1
          fi

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if grep -Fqx -- "${address}" <<<"${state_list}"; then
              if ! tofu -chdir=terraform/${STACK_PATH} state show "${address}" >/dev/null; then
                echo "State lists ${address}, but state show failed; refusing to import or continue." >&2
                exit 1
              fi
              if [[ "${import_id}" != "." ]]; then
                state_id="$(tofu -chdir=terraform/${STACK_PATH} state show -no-color "${address}" | awk '$1 == "id" && $2 == "=" {gsub(/^\"|\"$/, "", $3); print $3; exit}')"
                if [[ -z "${state_id}" || "${state_id}" != "${import_id}" ]]; then
                  echo "State identity for ${address} does not match the live RouterOS object; refusing to continue." >&2
                  exit 1
                fi
              fi
            else
              tofu -chdir=terraform/${STACK_PATH} import -input=false "${address}" "${import_id}" >/dev/null
            fi
          }

          veths="$(routeros_request GET "${ROUTEROS_URL}/rest/interface/veth")"
          ports="$(routeros_request GET "${ROUTEROS_URL}/rest/interface/bridge/port")"
          vlans="$(routeros_request GET "${ROUTEROS_URL}/rest/interface/bridge/vlan")"
          files="$(routeros_request GET "${ROUTEROS_URL}/rest/file")"
          mounts="$(routeros_request GET "${ROUTEROS_URL}/rest/container/mounts")"
          containers="$(routeros_request GET "${ROUTEROS_URL}/rest/container")"
          container_config="$(routeros_request GET "${ROUTEROS_URL}/rest/container/config")"

          if ! jq -e 'type == "array"' <<<"${veths}" >/dev/null ||
             ! jq -e 'type == "array"' <<<"${ports}" >/dev/null ||
             ! jq -e 'type == "array"' <<<"${vlans}" >/dev/null ||
             ! jq -e 'type == "array"' <<<"${files}" >/dev/null ||
             ! jq -e 'type == "array"' <<<"${mounts}" >/dev/null ||
             ! jq -e 'type == "array"' <<<"${containers}" >/dev/null ||
             ! jq -e 'type == "object"' <<<"${container_config}" >/dev/null; then
            echo "RouterOS returned a malformed qdevice collection or configuration response." >&2
            exit 1
          fi

          if ! jq -e '
            [.[] | select(.name == "veth-qnetd")] as $matches
            | ($matches | length == 1)
              and ($matches[0].address == "10.1.100.252/24")
              and ($matches[0].gateway == "10.1.100.1")
          ' <<<"${veths}" >/dev/null; then
            echo "The live qdevice veth is missing, duplicated, or has an unexpected address." >&2
            exit 1
          fi

          if ! jq -e '
            [.[] | select(.interface == "veth-qnetd")] as $matches
            | ($matches | length == 1)
              and ($matches[0].bridge == "bridge")
              and ($matches[0].pvid == "100")
              and ($matches[0]["frame-types"] == "admit-only-untagged-and-priority-tagged")
          ' <<<"${ports}" >/dev/null; then
            echo "The live qdevice bridge port is missing, duplicated, or has unexpected VLAN admission." >&2
            exit 1
          fi

          if ! jq -e --argjson desired_tagged "${qdevice_tagged}" --argjson desired_untagged "${qdevice_untagged}" '
            def members($value):
              if $value == null then []
              elif ($value | type) == "array" then $value
              elif ($value | type) == "string" then ($value | split(",") | map(select(length > 0)))
              else []
              end;
            def occurrences($value; $member):
              [members($value)[] | select(. == $member)] | length;
            def vlan_ids($value): members($value);
            . as $all
            | [.[] | select(.bridge == "bridge" and (vlan_ids(.["vlan-ids"]) == ["100"]))] as $matches
            | ([ $all[] | occurrences(.untagged; "veth-qnetd") ] | add // 0) as $untagged_occurrences
            | ([ $all[] | occurrences(.tagged; "veth-qnetd") ] | add // 0) as $tagged_occurrences
            | ($matches | length == 1)
              and ((members($matches[0].tagged) | sort) == ($desired_tagged | sort))
              and ((members($matches[0].untagged) | sort) == ($desired_untagged | sort))
              and (occurrences($matches[0].untagged; "veth-qnetd") == 1)
              and (occurrences($matches[0].tagged; "veth-qnetd") == 0)
              and ($untagged_occurrences == 1)
              and ($tagged_occurrences == 0)
          ' <<<"${vlans}" >/dev/null; then
            echo "The live VLAN 100 row does not contain exactly one safe qdevice attachment." >&2
            exit 1
          fi

          if ! jq -e --argjson required "${required_paths}" '
            . as $files
            | (type == "array")
              and all($files[];
                ((.name | type) == "string")
                and ((.type | type) == "string")
              )
              and all($required[];
                . as $path
                | any($files[]; .name == $path and .type == "directory")
              )
          ' <<<"${files}" >/dev/null; then
            echo "One or more qdevice USB prerequisite directories are missing or not directories." >&2
            exit 1
          fi

          if ! jq -e --argjson wanted "${qdevice_container_spec}" --arg image "${qdevice_image}" --arg interface "${qdevice_interface}" --arg root_dir "${qdevice_root_dir}" '
            def values:
              if type == "array" and all(.[]; type == "string") then .
              elif type == "string" then split(",") | map(select(length > 0))
              else null
              end;
            def truthy:
              tostring | ascii_downcase as $value | ["true", "yes", "on", "1"] | index($value) != null;
            . as $containers
            | if ($containers | type) != "array" then false
              else
                [$containers[] | select((.["remote-image"] // .remote_image // "") == $image)] as $matches
                | if ($containers | length) == 0 then true
                  elif ($containers | length) != 1 or ($matches | length) != 1 then false
                  else
                    $matches[0] as $actual
                    | (($actual["remote-image"] // $actual.remote_image) | type) == "string"
                    and (($actual.interface | type) == "string")
                    and (($actual["root-dir"] // $actual.root_dir | type) == "string")
                    and (($actual.comment | type) == "string")
                    and (($actual["remote-image"] // $actual.remote_image) == $wanted["remote-image"])
                    and ($actual.interface == $interface)
                    and (($actual["root-dir"] // $actual.root_dir) == $root_dir)
                    and ($actual.comment == $wanted.comment)
                    and (((($actual.mountlists // $actual.mounts) | values) // []) | sort) == ($wanted.mountlists | sort)
                    and (($actual["start-on-boot"] // $actual.start_on_boot // false) | truthy)
                    and (($actual.logging // false) | truthy)
                  end
              end
          ' <<<"${containers}" >/dev/null; then
            echo "Existing RouterOS containers are not exactly the qnetd declaration." >&2
            exit 1
          fi

          if ! jq -e --argjson required "${qdevice_mount_specs}" '
            . as $mounts
            | ($mounts | type) == "array"
              and all($mounts[];
                . as $actual
                | (type == "object")
                  and (($actual.list | type) == "string")
                  and (($actual.src | type) == "string")
                  and (($actual.dst | type) == "string")
                  and (($actual.list | length) > 0)
                  and (($actual.src | length) > 0)
                  and (($actual.dst | length) > 0)
                  and any($required[];
                    .list == $actual.list
                    and .src == $actual.src
                    and .dst == $actual.dst
                  )
              )
              and (($mounts | map(.list) | unique | length) == ($mounts | length))
          ' <<<"${mounts}" >/dev/null; then
            echo "Existing RouterOS container mounts are absent or conflict with the qnetd declaration." >&2
            exit 1
          fi

          if ! jq -e --arg layer_dir "${qdevice_layer_dir}" --arg tmpdir "${qdevice_tmpdir}" --argjson containers "${containers}" '
            if (type != "object")
              or ((.["layer-dir"] | type) != "string")
              or ((.tmpdir | type) != "string") then
              false
            elif (($containers | length) == 0) then
              true
            else
              .["layer-dir"] == $layer_dir and .tmpdir == $tmpdir
            end
          ' <<<"${container_config}" >/dev/null; then
            live_layer_dir="$(jq -r 'if type == "object" and (.["layer-dir"] | type) == "string" then .["layer-dir"] else "<missing-or-non-string>" end' <<<"${container_config}")"
            live_tmpdir="$(jq -r 'if type == "object" and (.tmpdir | type) == "string" then .tmpdir else "<missing-or-non-string>" end' <<<"${container_config}")"
            container_count="$(jq -r 'if type == "array" then length else -1 end' <<<"${containers}")"
            echo "The global RouterOS container extraction paths conflict with qnetd: layer-dir=${live_layer_dir}, tmpdir=${live_tmpdir}, containers=${container_count}." >&2
            echo "The global RouterOS container extraction paths are unsafe for the live container set." >&2
            exit 1
          fi

          if ! jq -e '
            . as $config
            | if (type != "object")
              or ((($config["registry-url"] // $config.registry_url // "") | type) != "string")
              or ((($config["assumed-registry-url"] // "") | type) != "string") then
                false
              else
                ($config["registry-url"] // $config.registry_url // "") as $registry
                | ($config["assumed-registry-url"] // "") as $assumed
                | (["", "docker.io", "registry-1.docker.io", "https://registry-1.docker.io"] | index($registry) != null)
                  and (["", "docker.io", "registry-1.docker.io"] | index($assumed) != null)
              end
          ' <<<"${container_config}" >/dev/null; then
            echo "The existing global RouterOS container registry is not Docker Hub; refusing to overwrite it." >&2
            exit 1
          fi

          veth_id="$(jq -er '.[] | select(.name == "veth-qnetd") | .[".id"]' <<<"${veths}")"
          port_id="$(jq -er '.[] | select(.interface == "veth-qnetd") | .[".id"]' <<<"${ports}")"
          vlan_id="$(jq -er '.[] | select(."vlan-ids" == "100" and .bridge == "bridge") | .[".id"]' <<<"${vlans}")"

          import_if_missing 'routeros_interface_veth.qdevice[0]' "${veth_id}"
          import_if_missing 'routeros_interface_bridge_port.qdevice[0]' "${port_id}"
          import_if_missing 'routeros_interface_bridge_vlan.bridge_vlan["100"]' "${vlan_id}"
          import_if_missing 'routeros_container_config.qdevice[0]' .

      - name: Plan RouterOS qnetd quorum device
        run: >-
          tofu -chdir=terraform/${{ env.STACK_PATH }} plan
          -target=routeros_interface_veth.qdevice[0]
          -target=routeros_interface_bridge_port.qdevice[0]
          -target='routeros_interface_bridge_vlan.bridge_vlan["100"]'
          -target=routeros_container_config.qdevice[0]
          -target=routeros_file.qdevice_authorized_keys[0]
          -target=terraform_data.qdevice_mounts[0]
          -target=terraform_data.qdevice_container[0]
          -out=qdevice-tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Enforce qdevice-only plan
        shell: bash
        run: |
          set -euo pipefail

          if ! tofu -chdir=terraform/${{ env.STACK_PATH }} show -json qdevice-tofuplan |
            jq -e '
              [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes
              | [
                  "routeros_interface_veth.qdevice[0]",
                  "routeros_interface_bridge_port.qdevice[0]",
                  "routeros_interface_bridge_vlan.bridge_vlan[\"100\"]",
                  "routeros_container_config.qdevice[0]",
                  "routeros_file.qdevice_authorized_keys[0]",
                  "terraform_data.qdevice_mounts[0]",
                  "terraform_data.qdevice_container[0]"
                ] as $allowed
              | all($changes[]; (.address | IN($allowed[])))
                and all($changes[]; (.change.actions | index("delete") | not))
                and all($changes[]; (.change.actions | index("replace") | not))
            ' >/dev/null; then
            echo "The qdevice plan contains an unexpected, destructive, or unrelated change." >&2
            exit 1
          fi

      - name: Upload RouterOS qnetd plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}/qdevice-tofuplan
          if-no-files-found: error
          retention-days: 7

  gateway-qdevice-recovery-plan:
    name: Recover and plan RouterOS qnetd quorum device
    # RouterOS 7.23 uses native mount/container fields that the pinned
    # provider cannot write. This first production gate permits only the
    # narrowly scoped recovery and a fresh immutable plan.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_gateway_qdevice && !inputs.plan_gateway_qdevice && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_proxmox && !inputs.plan_gateway_proxmox && !inputs.apply_gateway_ether7 && !inputs.plan_gateway_ether7 && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: [validate-dispatch, gateway-qdevice-plan]
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      INITIAL_PLAN_ARTIFACT: network-gw-qdevice-tofuplan
      INITIAL_PLAN_FILE: qdevice-tofuplan
      TOFU_PLAN_ARTIFACT: network-gw-qdevice-recovery-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Download initial qdevice plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.INITIAL_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}

      - name: Get gateway qdevice secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: Set qdevice authorized public key
        shell: bash
        run: |
          set -euo pipefail

          public_key_file="terraform/$STACK_PATH/qdevice-authorized.pub"
          expected_fingerprint="SHA256:9x+cumin8611j5uKUYwq2kTRI6nVbTtxF9GoeISjeF8"
          public_key="$(tr -d '\r\n' < "$public_key_file")"
          actual_fingerprint="$(ssh-keygen -lf "$public_key_file" | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]
          qdevice_json="$(jq -cn --arg key "$public_key" '{enabled:true,ssh_public_key:$key}')"
          printf 'TF_VAR_qdevice=%s\n' "$qdevice_json" >> "$GITHUB_ENV"

      - name: OpenTofu init
        run: tofu -chdir=terraform/$STACK_PATH init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Recheck global path migration before initial apply
        shell: bash
        env:
          MIKROTIK_USERNAME: ${{ env.MIKROTIK_USERNAME }}
          MIKROTIK_PASSWORD: ${{ env.MIKROTIK_PASSWORD }}
          ROUTEROS_URL: https://10.1.100.1
        run: |
          set -euo pipefail

          # The first gate may authorize a shared global-path update only when
          # the reviewed plan changes those paths. Re-read the full container
          # list after the gate so a newly created stopped container cannot be
          # affected by the immutable initial artifact.
          migration_required="$(tofu -chdir=terraform/$STACK_PATH show -json "$INITIAL_PLAN_FILE" | jq -r '
            def path($value):
              ($value // {}) as $object
              | ($object["layer-dir"] // $object.layer_dir // "") as $layer_dir
              | ($object.tmpdir // "") as $tmpdir
              | [$layer_dir, $tmpdir];
            any(.resource_changes[]?;
              .address == "routeros_container_config.qdevice[0]"
              and ((path(.change.before)) != (path(.change.after)))
            )
          ')"
          if [[ "$migration_required" != true ]]; then
            exit 0
          fi

          routeros_request() {
            jq -nr '
              "user = " + (($ENV.MIKROTIK_USERNAME + ":" + $ENV.MIKROTIK_PASSWORD) | @json),
              "url = " + (($ENV.ROUTEROS_URL + "/rest/container") | @json),
              "request = \"GET\"",
              "insecure",
              "fail",
              "silent",
              "show-error"
            ' | curl --config -
          }

          containers="$(routeros_request)"
          if ! jq -e 'type == "array" and length == 0' <<<"${containers}" >/dev/null; then
            container_count="$(jq -r 'if type == "array" then length else -1 end' <<<"${containers}")"
            echo "The reviewed plan migrates global container paths, but RouterOS now has ${container_count} container(s); refusing the initial apply." >&2
            exit 1
          fi

      - name: Apply initial reviewed qdevice plan
        run: tofu -chdir=terraform/$STACK_PATH apply -auto-approve "$INITIAL_PLAN_FILE"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Recover native RouterOS qdevice mounts and container
        run: bash scripts/routeros-qdevice-recovery.sh
        env:
          MIKROTIK_USERNAME: ${{ env.MIKROTIK_USERNAME }}
          MIKROTIK_PASSWORD: ${{ env.MIKROTIK_PASSWORD }}
          ROUTEROS_URL: https://10.1.100.1
          STACK_PATH: ${{ env.STACK_PATH }}

      - name: Create immutable post-recovery qdevice plan
        run: >-
          tofu -chdir=terraform/$STACK_PATH plan
          -target=routeros_interface_veth.qdevice[0]
          -target=routeros_interface_bridge_port.qdevice[0]
          -target='routeros_interface_bridge_vlan.bridge_vlan["100"]'
          -target=routeros_container_config.qdevice[0]
          -target=routeros_file.qdevice_authorized_keys[0]
          -target=terraform_data.qdevice_mounts[0]
          -target=terraform_data.qdevice_container[0]
          -out=$TOFU_PLAN_ARTIFACT
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Enforce qdevice-only recovered plan
        shell: bash
        run: |
          set -euo pipefail

          if ! tofu -chdir=terraform/$STACK_PATH show -json "$TOFU_PLAN_ARTIFACT" |
            jq -e '
              [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes
              | [
                  "routeros_interface_veth.qdevice[0]",
                  "routeros_interface_bridge_port.qdevice[0]",
                  "routeros_interface_bridge_vlan.bridge_vlan[\"100\"]",
                  "routeros_container_config.qdevice[0]",
                  "routeros_file.qdevice_authorized_keys[0]",
                  "terraform_data.qdevice_mounts[0]",
                  "terraform_data.qdevice_container[0]"
                ] as $allowed
              | all($changes[]; (.address | IN($allowed[])))
                and all($changes[]; (.change.actions | index("delete") | not))
                and all($changes[]; (.change.actions | index("replace") | not))
            ' >/dev/null; then
            echo "The recovered qdevice plan contains an unexpected or destructive change." >&2
            exit 1
          fi

      - name: Upload recovered RouterOS qnetd plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}/${{ env.TOFU_PLAN_ARTIFACT }}
          if-no-files-found: error
          retention-days: 7

  gateway-qdevice-apply:
    name: Apply RouterOS qnetd quorum device
    # The second production gate applies only the fresh artifact produced
    # after native recovery and review of the resulting OpenTofu changes.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_gateway_qdevice && !inputs.plan_gateway_qdevice && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_proxmox && !inputs.plan_gateway_proxmox && !inputs.apply_gateway_ether7 && !inputs.plan_gateway_ether7 && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: [validate-dispatch, gateway-qdevice-recovery-plan]
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-qdevice-recovery-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Download RouterOS qnetd plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}

      - name: Get gateway qdevice secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: Set qdevice authorized public key
        shell: bash
        run: |
          set -euo pipefail

          public_key_file="terraform/${STACK_PATH}/qdevice-authorized.pub"
          expected_fingerprint="SHA256:9x+cumin8611j5uKUYwq2kTRI6nVbTtxF9GoeISjeF8"
          public_key="$(tr -d '\r\n' < "${public_key_file}")"
          actual_fingerprint="$(ssh-keygen -lf "${public_key_file}" | awk '{print $2}')"
          [[ "${actual_fingerprint}" == "${expected_fingerprint}" ]]
          qdevice_json="$(jq -cn --arg key "${public_key}" '{enabled:true,ssh_public_key:$key}')"
          printf 'TF_VAR_qdevice=%s\n' "${qdevice_json}" >> "${GITHUB_ENV}"

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Apply RouterOS qnetd plan
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} apply -auto-approve "$TOFU_PLAN_ARTIFACT"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Verify qnetd live state and ports
        shell: bash
        env:
          MIKROTIK_USERNAME: ${{ env.MIKROTIK_USERNAME }}
          MIKROTIK_PASSWORD: ${{ env.MIKROTIK_PASSWORD }}
          ROUTEROS_URL: https://10.1.100.1
        run: |
          set -euo pipefail

          # Use curl's stdin configuration and pipe responses directly to jq
          # so credentials and raw RouterOS responses are never logged.
          routeros_request() {
            local method="$1"
            local url="$2"
            local payload=${3-}

            REQUEST_METHOD="$method" REQUEST_URL="$url" REQUEST_PAYLOAD="$payload" \
              jq -nr '
                "user = " + (($ENV.MIKROTIK_USERNAME + ":" + $ENV.MIKROTIK_PASSWORD) | @json),
                "url = " + ($ENV.REQUEST_URL | @json),
                "request = " + ($ENV.REQUEST_METHOD | @json),
                "insecure",
                "fail",
                "silent",
                "show-error",
                "header = " + ("Content-Type: application/json" | @json),
                (if ($ENV.REQUEST_PAYLOAD // "") == "" then empty else "data = " + ($ENV.REQUEST_PAYLOAD | @json) end)
              ' | curl --config -
          }

          # Derive every native mount/container/config value from the two
          # state-only records written by the initial reviewed plan. The full
          # state is piped straight to jq and only those two addresses leave
          # the command; no state dump is logged.
          qdevice_desired="$(
            tofu -chdir=terraform/${STACK_PATH} show -json |
              jq -ce '
                [
                  .values.root_module.resources[]?
                  | select(
                      .address == "terraform_data.qdevice_mounts[0]"
                      or .address == "terraform_data.qdevice_container[0]"
                    )
                  | {address, input: .values.input}
                ] as $records
                | if ($records | length) != 2 then
                    error("qdevice desired-state records are missing")
                  else
                    (reduce $records[] as $record ({}; .[$record.address] = $record.input)) as $desired
                    | {
                        mounts: $desired["terraform_data.qdevice_mounts[0]"],
                        container: $desired["terraform_data.qdevice_container[0]"]
                      }
                  end
              '
          )"
          mount_specs="$(jq -ce '.mounts | to_entries | map({list:.key,src:.value.src,dst:.value.dst})' <<<"${qdevice_desired}")"
          container_spec="$(jq -ce '.container' <<<"${qdevice_desired}")"
          network_spec="$(jq -ce '.container.network' <<<"${qdevice_desired}")"
          container_config_spec="$(jq -ce '.container.container_config' <<<"${qdevice_desired}")"
          qdevice_interface="$(jq -er '.interface_name' <<<"${network_spec}")"
          qdevice_address="$(jq -er '.address' <<<"${network_spec}")"
          qdevice_host="${qdevice_address%%/*}"
          qdevice_gateway="$(jq -er '.gateway' <<<"${network_spec}")"
          qdevice_vlan="$(jq -er '.vlan_id | tostring' <<<"${network_spec}")"
          qdevice_bridge="$(jq -er '.bridge' <<<"${network_spec}")"
          qdevice_frame_types="$(jq -er '.frame_types' <<<"${network_spec}")"
          qdevice_layer_dir="$(jq -er '.layer_dir' <<<"${container_config_spec}")"
          qdevice_tmpdir="$(jq -er '.tmpdir' <<<"${container_config_spec}")"
          qdevice_tagged="$(jq -ce '.tagged' <<<"${network_spec}")"
          qdevice_untagged="$(jq -ce '.untagged' <<<"${network_spec}")"
          key_path="$(jq -er '.container.container_config.authorized_key_path' <<<"${qdevice_desired}")"

          routeros_request GET "$ROUTEROS_URL/rest/interface/veth" | jq -e --arg interface "$qdevice_interface" --arg address "$qdevice_address" --arg gateway "$qdevice_gateway" '
            if type != "array" then false
            else
              [.[] | select(.name == $interface)] as $matches
              | ($matches | length == 1)
                and ($matches[0].address == $address)
                and ($matches[0].gateway == $gateway)
            end
          ' >/dev/null
          routeros_request GET "$ROUTEROS_URL/rest/interface/bridge/port" | jq -e --arg interface "$qdevice_interface" --arg bridge "$qdevice_bridge" --arg pvid "$qdevice_vlan" --arg frame_types "$qdevice_frame_types" '
            if type != "array" then false
            else
              [.[] | select(.interface == $interface)] as $matches
              | ($matches | length == 1)
                and ($matches[0].bridge == $bridge)
                and (($matches[0].pvid | tostring) == $pvid)
                and ($matches[0]["frame-types"] == $frame_types)
            end
          ' >/dev/null
          routeros_request GET "$ROUTEROS_URL/rest/interface/bridge/vlan" | jq -e --arg interface "$qdevice_interface" --arg bridge "$qdevice_bridge" --arg vlan "$qdevice_vlan" --argjson desired_tagged "$qdevice_tagged" --argjson desired_untagged "$qdevice_untagged" '
            def members($value):
              if $value == null then []
              elif ($value | type) == "array" then $value
              elif ($value | type) == "string" then ($value | split(",") | map(select(length > 0)))
              else []
              end;
            def occurrences($value; $member):
              [members($value)[] | select(. == $member)] | length;
            def vlan_ids($value): members($value);
            if type != "array" then false
            else
              . as $all
              | [ $all[] | select(.bridge == $bridge and (vlan_ids(.["vlan-ids"]) == [$vlan])) ] as $matches
              | ([ $all[] | occurrences(.untagged; $interface) ] | add // 0) as $untagged_occurrences
              | ([ $all[] | occurrences(.tagged; $interface) ] | add // 0) as $tagged_occurrences
              | ($matches | length == 1)
                and ((members($matches[0].tagged) | sort) == ($desired_tagged | sort))
                and ((members($matches[0].untagged) | sort) == ($desired_untagged | sort))
                and (occurrences($matches[0].untagged; $interface) == 1)
                and (occurrences($matches[0].tagged; $interface) == 0)
                and ($untagged_occurrences == 1)
                and ($tagged_occurrences == 0)
            end
          ' >/dev/null
          routeros_request GET "$ROUTEROS_URL/rest/container/config" | jq -e --arg layer_dir "$qdevice_layer_dir" --arg tmpdir "$qdevice_tmpdir" '
            (type == "object")
            and (.["layer-dir"] | type) == "string"
            and (.tmpdir | type) == "string"
            and .["layer-dir"] == $layer_dir
            and .tmpdir == $tmpdir
          ' >/dev/null
          routeros_request GET "$ROUTEROS_URL/rest/container/mounts" | jq -e --argjson required "$mount_specs" '
            (type == "array")
            and (length == 3)
            and (all(.[]; type == "object" and (.list | type) == "string" and (.src | type) == "string" and (.dst | type) == "string"))
            and (map({list:.list,src:.src,dst:.dst}) | sort_by(.list)) == ($required | sort_by(.list))
          ' >/dev/null
          routeros_request GET "$ROUTEROS_URL/rest/container" | jq -e --argjson wanted "$container_spec" '
            def values:
              if . == null then []
              elif type == "array" then .
              elif type == "string" then split(",") | map(select(length > 0))
              else []
              end;
            def truthy:
              tostring | ascii_downcase as $value | ["true", "yes", "on", "1"] | index($value) != null;
            (type == "array")
            and (length == 1)
            and (.[0] as $actual
              | ($actual["remote-image"] // "") == $wanted["remote-image"]
                and ($actual.interface // "") == $wanted.interface
                and ($actual["root-dir"] // "") == $wanted["root-dir"]
                and (($actual.mountlists // []) | values | sort) == ($wanted.mountlists | sort)
                and (($actual["start-on-boot"] // false) | truthy)
                and (($actual.logging // false) | truthy)
                and ($actual.comment // "") == $wanted.comment
                and (($actual.status // "") | ascii_downcase) == "running")
          ' >/dev/null
          public_key_file="terraform/${STACK_PATH}/qdevice-authorized.pub"
          expected_key_content="$(printf '%s\n' "$(tr -d '\r\n' < "${public_key_file}")")"
          routeros_request GET "$ROUTEROS_URL/rest/file?.proplist=name,type,size,contents" |
            jq -e --arg key_path "$key_path" --arg expected_content "$expected_key_content" '
              (type == "array")
                and ([.[] | select(.name == $key_path)] | length == 1)
                and ([.[] | select(.name == $key_path)][0].type == "file")
                and (([.[] | select(.name == $key_path)][0].size // "0" | tonumber) > 0)
                and ([.[] | select(.name == $key_path)][0].contents == $expected_content)
            ' >/dev/null

          if (command -v nc >/dev/null 2>&1 && nc -z -w 8 "$qdevice_host" 5403 >/dev/null 2>&1) ||
             (timeout 8 bash -c "</dev/tcp/${qdevice_host}/5403" >/dev/null 2>&1); then
            printf 'qnetd=reachable\n'
          else
            echo "qnetd TCP/5403 is unreachable." >&2
            exit 1
          fi

  gateway-proxmox-plan:
    name: Plan Kubernetes to Proxmox firewall rule
    # This recovery path targets only the exporter exception and its terminal
    # deny anchor, avoiding the broader pending firewall hardening plan.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.apply_gateway_proxmox || inputs.plan_gateway_proxmox) && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: validate-dispatch

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-proxmox-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Get gateway Proxmox secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Plan Kubernetes to Proxmox firewall rule
        run: >-
          tofu -chdir=terraform/${{ env.STACK_PATH }} plan
          -target=routeros_ip_firewall_filter.forward_drop_inter_vlan
          -target=routeros_ip_firewall_filter.allow_kubernetes_proxmox
          -out=proxmox-tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Enforce single-create Proxmox plan
        shell: bash
        env:
          # Apply mode must carry the one reviewed create. Review-only mode
          # also accepts an empty plan after that create has been applied.
          EXPECT_PROXMOX_CREATE: ${{ inputs.apply_gateway_proxmox || false }}
        run: |
          set -euo pipefail

          # Every non-no-op change must be the single expected create. A
          # review-only rerun is also valid when the recovery is already live.
          if ! tofu -chdir=terraform/${{ env.STACK_PATH }} show -json proxmox-tofuplan \
            | jq -e --arg expect_create "${EXPECT_PROXMOX_CREATE}" '
              [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes
              | if $expect_create == "true" then
                  ($changes | length) == 1
                  and $changes[0].address == "routeros_ip_firewall_filter.allow_kubernetes_proxmox"
                  and $changes[0].change.actions == ["create"]
                else
                  ($changes | length) == 0
                  or (($changes | length) == 1
                    and $changes[0].address == "routeros_ip_firewall_filter.allow_kubernetes_proxmox"
                    and $changes[0].change.actions == ["create"])
                end
            ' >/dev/null; then
            echo "The Proxmox recovery plan is not an empty plan or one firewall-rule create; refusing to upload it." >&2
            exit 1
          fi

      - name: Upload Kubernetes to Proxmox plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}/proxmox-tofuplan
          if-no-files-found: error
          retention-days: 7

  gateway-proxmox-apply:
    name: Apply Kubernetes to Proxmox firewall rule
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_gateway_proxmox && !inputs.plan_gateway_proxmox && !inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_bgp && !inputs.plan_gateway_bgp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: [validate-dispatch, gateway-proxmox-plan]
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-proxmox-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Download Kubernetes to Proxmox plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}

      - name: Get gateway Proxmox secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Apply Kubernetes to Proxmox plan
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} apply -auto-approve proxmox-tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Verify Proxmox exporter firewall rule
        shell: bash
        env:
          MIKROTIK_USERNAME: ${{ env.MIKROTIK_USERNAME }}
          MIKROTIK_PASSWORD: ${{ env.MIKROTIK_PASSWORD }}
          ROUTEROS_URL: https://10.1.100.1
        run: |
          set -euo pipefail

          # Project only the stable comments and rule fields needed to verify
          # the live postcondition; never print the raw RouterOS response.
          rules="$(curl --fail --silent --show-error --insecure \
            --user "${MIKROTIK_USERNAME}:${MIKROTIK_PASSWORD}" \
            "${ROUTEROS_URL}/rest/ip/firewall/filter")"
          jq -e '
            . as $rules
            | [$rules[] | select(.comment == "sk-firewall/forward/allow-kubernetes-proxmox")] as $allows
            | [$rules[] | select(.comment == "sk-firewall/forward/drop-inter-vlan")] as $drops
            | if ($allows | length) != 1 or ($drops | length) != 1 then
                error("expected one Proxmox allow rule and one inter-VLAN deny")
              else
                ($allows[0] | .action == "accept"
                  and .chain == "forward"
                  and .["src-address"] == "10.1.20.0/24"
                  and .["dst-address"] == "10.1.100.201"
                  and .protocol == "tcp"
                  and .["dst-port"] == "8006")
                and (($rules | map(.comment) | index("sk-firewall/forward/allow-kubernetes-proxmox"))
                  < ($rules | map(.comment) | index("sk-firewall/forward/drop-inter-vlan")))
              end
          ' <<<"${rules}" >/dev/null

