name: OpenTofu

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_gateway:
        # Keep network mutation explicitly opt-in while still allowing an
        # ordinary manual dispatch to refresh plans for every stack.
        description: Apply the reviewed gateway plan from this run
        required: true
        default: false
        type: boolean
      apply_gateway_snmp:
        # Keep the provider-compatible SNMP identities and device-access rule
        # independently applicable while RouterOS 7.21/7.22 breaks unrelated
        # gateway resource updates.
        description: Apply only the dedicated SNMP resources
        required: true
        default: false
        type: boolean
      plan_gateway_snmp:
        # Permit an explicit reviewable SNMP-only plan without also opening a
        # production apply. This isolates the provider-broken interface stack.
        description: Plan only the dedicated SNMP resources
        required: true
        default: false
        type: boolean
      apply_gateway_bgp:
        # BGP peer reconciliation gets a dedicated immutable artifact so the
        # missing worker sessions can be restored without touching unrelated
        # provider-sensitive gateway resources.
        description: Apply only the reviewed gateway BGP peers
        required: true
        default: false
        type: boolean
      plan_gateway_bgp:
        # Keep BGP recovery reviewable without granting a production mutation.
        description: Plan only the dedicated gateway BGP peers
        required: true
        default: false
        type: boolean
      apply_gateway_firewall:
        # Firewall policy gets a dedicated targeted artifact so
        # provider-broken interface, IP-address, and BGP resources are not
        # evaluated together.
        description: Apply only the reviewed gateway firewall policy
        required: true
        default: false
        type: boolean
      plan_gateway_firewall:
        # Permit a review-only firewall plan without granting a production
        # mutation. Applying it remains a separate explicit dispatch.
        description: Plan only the gateway firewall policy
        required: true
        default: false
        type: boolean
      apply_gateway_proxmox:
        # The exporter recovery path must not evaluate or apply the broader
        # firewall hardening plan at the same time.
        description: Apply only the Kubernetes to Proxmox firewall rule
        required: true
        default: false
        type: boolean
      plan_gateway_proxmox:
        # Permit a review-only Proxmox exporter recovery plan before applying
        # its single firewall exception in a separate production-gated run.
        description: Plan only the Kubernetes to Proxmox firewall rule
        required: true
        default: false
        type: boolean
      apply_gateway_qdevice:
        # Keep the USB-backed qnetd container isolated from provider-sensitive
        # gateway resources and require a separate production approval.
        description: Apply only the reviewed RouterOS qnetd quorum device
        required: true
        default: false
        type: boolean
      plan_gateway_qdevice:
        # Permit a review-only qnetd plan without granting a production
        # mutation. The apply remains a separate explicit dispatch.
        description: Plan only the RouterOS qnetd quorum device
        required: true
        default: false
        type: boolean
      apply_gateway_ether7:
        # Isolate the Dell Server switchport reconciliation from the broader
        # gateway stack and its still-pending firewall changes.
        description: Apply only the reviewed Dell Server ether7 VLAN configuration
        required: true
        default: false
        type: boolean
      plan_gateway_ether7:
        # Permit a review-only ether7 plan before the production-gated apply.
        description: Plan only the Dell Server ether7 VLAN configuration
        required: true
        default: false
        type: boolean
      apply_gateway_wireguard:
        # WireGuard peer adoption gets its own targeted artifact so unrelated
        # provider-broken gateway resources are not evaluated together.
        description: Apply only the reviewed gateway WireGuard adoption
        required: true
        default: false
        type: boolean
      apply_gateway_dhcp:
        # Keep network-wide DHCP changes explicitly opt-in and independently
        # reviewable from unrelated gateway interface and BGP resources.
        description: Apply the reviewed gateway DHCP plan
        required: true
        default: false
        type: boolean
      apply_gateway_ipfix:
        # The IPFIX traffic-flow resources are safe to adopt even while the
        # provider breaks unrelated interface updates, so they get their own
        # dedicated targeted plan with full mutual exclusion.
        description: Apply only the dedicated IPFIX traffic-flow resources
        required: true
        default: false
        type: boolean
      apply_cloudflare:
        # Public routing and Access changes require an explicit reviewed apply
        # from main and must not share a dispatch with gateway mutation.
        description: Apply the reviewed Cloudflare tunnel and Access plan
        required: true
        default: false
        type: boolean

# This workflow is trusted-only. Pull requests use the separate validation
# workflow, which has no backend, infrastructure, or Bitwarden credentials.
permissions:
  contents: read

concurrency:
  group: opentofu
  # Never interrupt an apply because another push or dispatch started.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-dispatch:
    name: Validate OpenTofu dispatch
    # Fail before any trusted job can retrieve credentials when a manual run is
    # pointed at a non-main ref or selects more than one mutation mode.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      APPLY_GATEWAY: ${{ inputs.apply_gateway || false }}
      APPLY_GATEWAY_SNMP: ${{ inputs.apply_gateway_snmp || false }}
      PLAN_GATEWAY_SNMP: ${{ inputs.plan_gateway_snmp || false }}
      APPLY_GATEWAY_BGP: ${{ inputs.apply_gateway_bgp || false }}
      PLAN_GATEWAY_BGP: ${{ inputs.plan_gateway_bgp || false }}
      APPLY_GATEWAY_FIREWALL: ${{ inputs.apply_gateway_firewall || false }}
      PLAN_GATEWAY_FIREWALL: ${{ inputs.plan_gateway_firewall || false }}
      APPLY_GATEWAY_PROXMOX: ${{ inputs.apply_gateway_proxmox || false }}
      PLAN_GATEWAY_PROXMOX: ${{ inputs.plan_gateway_proxmox || false }}
      APPLY_GATEWAY_QDEVICE: ${{ inputs.apply_gateway_qdevice || false }}
      PLAN_GATEWAY_QDEVICE: ${{ inputs.plan_gateway_qdevice || false }}
      APPLY_GATEWAY_ETHER7: ${{ inputs.apply_gateway_ether7 || false }}
      PLAN_GATEWAY_ETHER7: ${{ inputs.plan_gateway_ether7 || false }}
      APPLY_GATEWAY_WIREGUARD: ${{ inputs.apply_gateway_wireguard || false }}
      APPLY_GATEWAY_DHCP: ${{ inputs.apply_gateway_dhcp || false }}
      APPLY_GATEWAY_IPFIX: ${{ inputs.apply_gateway_ipfix || false }}
      APPLY_CLOUDFLARE: ${{ inputs.apply_cloudflare || false }}
      WORKFLOW_REF: ${{ github.ref }}

    steps:
      - name: Check trusted ref and mutation mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Trusted OpenTofu runs must use the main branch." >&2
            exit 1
          fi

          selected_modes=0
          for mode in \
            "${APPLY_GATEWAY}" \
            "${APPLY_GATEWAY_SNMP}" \
            "${PLAN_GATEWAY_SNMP}" \
            "${APPLY_GATEWAY_BGP}" \
            "${PLAN_GATEWAY_BGP}" \
            "${APPLY_GATEWAY_FIREWALL}" \
            "${PLAN_GATEWAY_FIREWALL}" \
            "${APPLY_GATEWAY_PROXMOX}" \
            "${PLAN_GATEWAY_PROXMOX}" \
            "${APPLY_GATEWAY_QDEVICE}" \
            "${PLAN_GATEWAY_QDEVICE}" \
            "${APPLY_GATEWAY_ETHER7}" \
            "${PLAN_GATEWAY_ETHER7}" \
            "${APPLY_GATEWAY_WIREGUARD}" \
            "${APPLY_GATEWAY_DHCP}" \
            "${APPLY_GATEWAY_IPFIX}" \
            "${APPLY_CLOUDFLARE}"; do
            if [[ "${mode}" == "true" ]]; then
              selected_modes=$((selected_modes + 1))
            fi
          done

          if (( selected_modes > 1 )); then
            echo "Select at most one OpenTofu mutation mode per run." >&2
            exit 1
          fi

  detect-changes:
    name: Detect changed OpenTofu stacks
    runs-on: self-hosted
    needs: validate-dispatch
    strategy:
      matrix:
        stacks: [network/gw/interfaces, network/gw/dhcp, k3s/talos-cluster, cloudflare/tunnel]

    steps:
      # Check out the repository with full history so the workflow can compare
      # the current revision against the correct pull request or push base.
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

  tofu-plan:
    name: OpenTofu plan
    runs-on: self-hosted
    needs: [detect-changes, validate-dispatch]
    # Only ordinary main-branch planning may access remote state, provider
    # credentials, or immutable plan artifacts here; targeted modes use their
    # own isolated plan jobs below.
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && !(github.event_name == 'workflow_dispatch' && (inputs.apply_gateway_snmp || inputs.plan_gateway_snmp || inputs.apply_gateway_bgp || inputs.plan_gateway_bgp || inputs.apply_gateway_firewall || inputs.plan_gateway_firewall || inputs.apply_gateway_proxmox || inputs.plan_gateway_proxmox || inputs.apply_gateway_qdevice || inputs.plan_gateway_qdevice || inputs.apply_gateway_ether7 || inputs.plan_gateway_ether7 || inputs.apply_gateway_wireguard || inputs.apply_gateway_dhcp || inputs.apply_gateway_ipfix))
    strategy:
      max-parallel: 1
      matrix:
        # Targeted BGP, firewall, and WireGuard dispatches use dedicated jobs
        # and omit the provider-sensitive interface stack from this matrix.
        stacks: ${{ fromJSON((inputs.apply_gateway_bgp || inputs.plan_gateway_bgp || inputs.apply_gateway_firewall || inputs.plan_gateway_firewall || inputs.apply_gateway_proxmox || inputs.plan_gateway_proxmox || inputs.apply_gateway_qdevice || inputs.plan_gateway_qdevice || inputs.apply_gateway_ether7 || inputs.plan_gateway_ether7 || inputs.apply_gateway_wireguard) && '["network/gw/dhcp","k3s/talos-cluster","cloudflare/tunnel"]' || '["network/gw/interfaces","network/gw/dhcp","k3s/talos-cluster","cloudflare/tunnel"]') }}
    #if: needs.detect-changes.outputs.changed == 'true'

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Configure OpenTofu plan artifact
        run: |
          # Convert stack paths like network/gw/interfaces into artifact names
          # like network-gw-interfaces-tofuplan without duplicating matrix data.
          plan_artifact="${STACK_PATH//\//-}-tofuplan"
          echo "TOFU_PLAN_ARTIFACT=${plan_artifact}" >> "$GITHUB_ENV"
        env:
          STACK_PATH: ${{ matrix.stacks }}

      - name: Get Secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD
            704a25a3-5cb3-41a5-a0a1-b41c00c83189 > PROXMOX_VE_ENDPOINT
            bec590dc-5777-441f-8f4b-b41c00c84280 > PROXMOX_VE_API_TOKEN
            f6a9155e-b392-45b8-8254-b41c00c87486 > PROXMOX_VE_SSH_USERNAME
            a64de379-c939-4d47-841e-b41c00c8641d > PROXMOX_SSH_PRIVATE_KEY
            34461539-ca00-4f0b-b7e0-b41b00c9c243 > CLOUDFLARE_ACCOUNT_ID
            535c2d90-8239-4f6b-a70f-b41b00c9d06c > CLOUDFLARE_API_TOKEN
            483e35d1-7bd1-46df-9946-b48f00b093d8 > GRAFANA_ACCESS_EMAIL

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ matrix.stacks }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: OpenTofu validate
        run: tofu -chdir=terraform/${{ matrix.stacks }} validate

      - name: OpenTofu plan
        run: tofu -chdir=terraform/${{ matrix.stacks }} plan -out=tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_proxmox_endpoint: ${{ env.PROXMOX_VE_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ env.PROXMOX_VE_API_TOKEN }}
          TF_VAR_proxmox_ssh_private_key: ${{ env.PROXMOX_SSH_PRIVATE_KEY }}
          TF_VAR_proxmox_ssh_username: ${{ env.PROXMOX_VE_SSH_USERNAME }}
          TF_VAR_cloudflare_account_id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_access_email: ${{ env.GRAFANA_ACCESS_EMAIL }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

      - name: Upload OpenTofu plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ matrix.stacks }}/tofuplan
          if-no-files-found: error
          retention-days: 7

  tofu-apply:
    name: OpenTofu apply
    # Talos remains automatically applied only after a main-branch push. A
    # gateway dispatch must not implicitly mutate this separate stack.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    needs: tofu-plan
    strategy:
      max-parallel: 1
      matrix:
        # Apply only the stack whose main-branch changes are safe to automate;
        # gateway and Cloudflare control-plane stacks stay plan-only because
        # network and external-access changes have higher operational impact.
        stacks: [k3s/talos-cluster]

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Configure OpenTofu plan artifact
        run: |
          # Keep artifact naming derived from the stack path so adding stacks
          # only requires extending the matrix list.
          plan_artifact="${STACK_PATH//\//-}-tofuplan"
          echo "TOFU_PLAN_ARTIFACT=${plan_artifact}" >> "$GITHUB_ENV"
        env:
          STACK_PATH: ${{ matrix.stacks }}

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Download OpenTofu plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ matrix.stacks }}

      - name: Get Secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            704a25a3-5cb3-41a5-a0a1-b41c00c83189 > PROXMOX_VE_ENDPOINT
            bec590dc-5777-441f-8f4b-b41c00c84280 > PROXMOX_VE_API_TOKEN
            f6a9155e-b392-45b8-8254-b41c00c87486 > PROXMOX_VE_SSH_USERNAME
            a64de379-c939-4d47-841e-b41c00c8641d > PROXMOX_SSH_PRIVATE_KEY
            2ea66873-6852-4af9-bca2-b48f00f84a0a > PROXMOX_EXPORTER_API_TOKEN

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ matrix.stacks }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: OpenTofu apply
        run: tofu -chdir=terraform/${{ matrix.stacks }} apply -auto-approve tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_proxmox_endpoint: ${{ env.PROXMOX_VE_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ env.PROXMOX_VE_API_TOKEN }}
          TF_VAR_proxmox_ssh_private_key: ${{ env.PROXMOX_SSH_PRIVATE_KEY }}
          TF_VAR_proxmox_ssh_username: ${{ env.PROXMOX_VE_SSH_USERNAME }}

      - name: Verify Proxmox exporter token handoff
        # The GitHub Bitwarden identity is intentionally read-only. Compare its
        # injected value with encrypted state and fail closed on any mismatch.
        run: |
          set +x
          exporter_token="$(tofu -chdir=terraform/${{ matrix.stacks }} output -raw proxmox_exporter_api_token)"

          case "${exporter_token}" in
            observability@pve!exporter=*) ;;
            *)
              echo "Proxmox exporter token output has an unexpected identity." >&2
              exit 1
              ;;
          esac

          echo "::add-mask::${exporter_token}"
          if [[ "${exporter_token}" != "${PROXMOX_EXPORTER_API_TOKEN}" ]]; then
            echo "Bitwarden does not match the OpenTofu-managed Proxmox exporter token." >&2
            exit 1
          fi
          unset exporter_token
        env:
          PROXMOX_EXPORTER_API_TOKEN: ${{ env.PROXMOX_EXPORTER_API_TOKEN }}

  gateway-apply:
    name: Apply reviewed gateway plan
    # Gateway mutation is available only as an explicit manual action against
    # main; pull requests and ordinary main pushes remain plan-only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_gateway && !inputs.apply_gateway_snmp && !inputs.plan_gateway_snmp && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted
    needs: tofu-plan
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/interfaces
      TOFU_PLAN_ARTIFACT: network-gw-interfaces-tofuplan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      # Apply the immutable artifact produced by this run instead of creating
      # a second, potentially different plan after approval.
      - name: Download reviewed OpenTofu plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TOFU_PLAN_ARTIFACT }}
          path: terraform/${{ env.STACK_PATH }}

      - name: Get gateway secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            2c67255f-36f4-4344-b94d-b459014e9249 > KUBERNETES_BGP_TCP_MD5_KEY
            f59a5c29-2dc7-4acf-b74b-b48e015b7439 > SNMP_V2_COMMUNITY
            1ae61563-170c-4a94-9fdf-b48e015b7484 > SNMP_V3_USERNAME
            12e0ba06-701b-400d-821d-b48e015b74cd > SNMP_V3_AUTH_PASSWORD
            90e81979-e50d-46e9-9177-b48e015b751a > SNMP_V3_PRIV_PASSWORD

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: OpenTofu apply
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} apply -auto-approve tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_kubernetes_bgp_tcp_md5_key: ${{ env.KUBERNETES_BGP_TCP_MD5_KEY }}
          TF_VAR_snmp_v2_community: ${{ env.SNMP_V2_COMMUNITY }}
          TF_VAR_snmp_v3_username: ${{ env.SNMP_V3_USERNAME }}
          TF_VAR_snmp_v3_auth_password: ${{ env.SNMP_V3_AUTH_PASSWORD }}
          TF_VAR_snmp_v3_priv_password: ${{ env.SNMP_V3_PRIV_PASSWORD }}

  gateway-snmp-plan:
    name: Plan gateway SNMP adoption
    # A separate targeted artifact avoids planning the provider-broken IP and
    # BGP updates while retaining reviewable, immutable OpenTofu execution.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.apply_gateway_snmp || inputs.plan_gateway_snmp) && !inputs.apply_gateway && !inputs.apply_gateway_firewall && !inputs.plan_gateway_firewall && !inputs.apply_gateway_wireguard && !inputs.apply_gateway_dhcp && !inputs.apply_gateway_ipfix && !inputs.apply_cloudflare
    runs-on: self-hosted

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
