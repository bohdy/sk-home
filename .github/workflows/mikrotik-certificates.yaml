name: MikroTik certificates

on:
  workflow_dispatch:
    inputs:
      bootstrap_gateway_certificate:
        # Use only while replacing the current expired gateway certificate.
        description: Bypass RouterOS TLS verification for one recovery run
        required: true
        default: false
        type: boolean
  schedule:
    # GitHub runs scheduled workflows from the current default-branch commit.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  # Serialize only certificate runs; unrelated OpenTofu work stays independent.
  group: mikrotik-certificates
  cancel-in-progress: false

jobs:
  renew-gateway-certificate:
    name: Renew gateway certificate
    # The production environment is the final approval and secret-access gate.
    runs-on: self-hosted
    environment: production

    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise-cache
      STACK_PATH: network/gw/certificates
      # The explicit bootstrap recovery uses the gateway's private HTTP REST
      # endpoint because an expired or broken HTTPS listener cannot accept the
      # provider connection. Scheduled and normal manual runs always use the
      # DNS name over HTTPS.
      TF_VAR_mikrotik_hosturl: ${{ inputs.bootstrap_gateway_certificate && 'http://10.1.100.1/' || 'https://gw.bohdal.name/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@v4.0.1
        with:
          install: true

      - name: Get certificate secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            f1a17686-db90-4ae0-80aa-b43701584bab > AWS_ACCESS_KEY_ID
            31f0524c-b94e-4446-ba46-b43701586360 > AWS_SECRET_ACCESS_KEY
            519790de-c23d-41f7-a838-b41b00c9444d > MIKROTIK_USERNAME
            6b950dde-8f31-4d7b-9fdc-b41b00c993ca > MIKROTIK_PASSWORD
            535c2d90-8239-4f6b-a70f-b41b00c9d06c > CLOUDFLARE_API_TOKEN
            483e35d1-7bd1-46df-9946-b48f00b093d8 > ACME_EMAIL

      - name: OpenTofu init
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: OpenTofu validate
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} validate

      - name: Create immutable certificate plan
        # Keep the sensitive binary plan solely in this approved runner job.
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} plan -out=certificate.tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_mikrotik_insecure: ${{ inputs.bootstrap_gateway_certificate || false }}
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_acme_email: ${{ env.ACME_EMAIL }}

      - name: Apply immutable certificate plan
        run: tofu -chdir=terraform/${{ env.STACK_PATH }} apply -auto-approve certificate.tofuplan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_mikrotik_username: ${{ env.MIKROTIK_USERNAME }}
          TF_VAR_mikrotik_password: ${{ env.MIKROTIK_PASSWORD }}
          TF_VAR_mikrotik_insecure: ${{ inputs.bootstrap_gateway_certificate || false }}
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_acme_email: ${{ env.ACME_EMAIL }}

      - name: Verify live gateway certificate binding
        shell: bash
        env:
          ROUTEROS_URL: ${{ env.TF_VAR_mikrotik_hosturl }}
        run: |
          set -euo pipefail
          ROUTEROS_URL="${ROUTEROS_URL%/}"
          curl_options=(--fail --silent --show-error --user "$MIKROTIK_USERNAME:$MIKROTIK_PASSWORD")
          if [ "${{ inputs.bootstrap_gateway_certificate || false }}" = "true" ]; then
            curl_options+=(--insecure)
          fi

          # Confirm the addressed listener and the selected certificate as a
          # postcondition, without emitting PEM, private keys, or credentials.
          service="$(curl "${curl_options[@]}" "$ROUTEROS_URL/rest/ip/service" \
            | jq -ce '
              [.[] | select(.name == "www-ssl" and ((.address // "") != ""))]
              | if length == 1 then .[0] else error("expected one addressed www-ssl service") end
            ')"
          certificate_name="$(jq -er '.certificate' <<<"$service")"
          certificates="$(curl "${curl_options[@]}" "$ROUTEROS_URL/rest/certificate")"
          # Keep the mismatch evidence reviewable without exposing PEM data.
          jq -n --argjson service "$service" --argjson certificates "$certificates" '
            {
              service: ($service | {id: .[".id"], name, address, certificate, disabled, invalid}),
              certificates: ($certificates | map({name, common_name: .["common-name"], private_key: .["private-key"], invalid_after: .["invalid-after"], expired, fingerprint}))
            }
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          certificate="$(jq -ce --arg name "$certificate_name" '
              [.[] | select(.name == $name)]
              | if length == 1 then .[0] else error("bound certificate was not found") end
            ' <<<"$certificates")"
          jq -e '(.expired != true) and .["private-key"] == "true"' <<<"$certificate" >/dev/null
          jq -n --argjson certificate "$certificate" \
            '{bound_certificate: ($certificate | {name, common_name: .["common-name"], private_key: .["private-key"], invalid_after: .["invalid-after"], expired, fingerprint})}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
