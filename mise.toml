[tools]
# Pin workflow and embedded-shell lint so local and hosted validation agree.
actionlint = "1.7.12"
shellcheck = "0.11.0"
kubectl = "latest"
"aqua:opentofu/opentofu" = "1.12.1"
pre-commit = "latest"

[tasks.dns-render]
description = "Render generated DNS manifests from the Flux DNS source tree."
run = "python3 scripts/render-dns.py"

[tasks.dns-check]
description = "Verify DNS rendered manifests and kustomize output are current."
run = [
  "python3 scripts/render-dns.py --check",
  "kubectl kustomize kubernetes/flux/infrastructure/dns/rendered >/dev/null",
]

[tasks.smtp-relay-preflight]
description = "Verify live SMTP relay prerequisites without reading Secret data."
run = "bash scripts/smtp-relay-preflight.sh"

[tasks.workflow-test]
description = "Verify stack selection, checkpoints, and workflow trust boundaries."
run = "node --test .github/scripts/*.test.cjs"

[tasks.workflow-check]
description = "Validate the catalog, workflow contracts, and GitHub Actions syntax."
# Resolve the pinned executable explicitly and fail if it is missing; actionlint
# otherwise silently omits embedded-shell checks when ShellCheck is unavailable.
run = [
  "node .github/scripts/validate-catalog.cjs",
  "mise run workflow-test",
  """
  set -eu
  shellcheck_path="$(mise which shellcheck)"
  test -x "$shellcheck_path"
  actionlint -shellcheck "$shellcheck_path"
  """,
]
