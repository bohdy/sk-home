[tools]
# Helm renders the pinned CNPG operator chart during credential-free validation.
helm = "4.3.0"
"aqua:prometheus/prometheus" = "3.15.0"
kubectl = "latest"
"aqua:opentofu/opentofu" = "1.12.1"
pre-commit = "latest"

[tasks.dns-render]
description = "Render generated DNS manifests from the Flux DNS source tree."
run = "python3 scripts/render-dns.py"

[tasks.dns-check]
description = "Verify DNS rendered manifests and kustomize output are current."
run = [
  "python3 scripts/render-dns.py --check",
  "kubectl kustomize kubernetes/flux/infrastructure/dns/rendered >/dev/null",
]

[tasks.smtp-relay-preflight]
description = "Verify live SMTP relay prerequisites without reading Secret data."
run = "bash scripts/smtp-relay-preflight.sh"

[tasks.nas-tls-test]
description = "Run credential-free offline NAS TLS reconciler tests."
run = "python3 -m unittest discover -s tests -p 'test_nas_tls*.py'"

[tasks.nas-tls-bootstrap-check]
description = "Run synthetic create-only NAS TLS Bitwarden bootstrap checks without credentials."
run = "python3 scripts/test-nas-tls-bootstrap.py"

[tasks.nas-tls-alerts-check]
description = "Run native promtool semantic tests for NAS TLS alert rules."
run = "python3 scripts/nas-tls-alerts-check.py"

[tasks.nas-tls-check]
description = "Render every staged NAS TLS tree and run its offline tests."
run = [
  "mise run nas-tls-test",
  "mise run nas-tls-bootstrap-check",
  "mise run nas-tls-alerts-check",
  "kubectl kustomize kubernetes/flux/infrastructure/nas-tls/issue >/dev/null",
  "kubectl kustomize kubernetes/flux/infrastructure/nas-tls/bootstrap >/dev/null",
  "kubectl kustomize kubernetes/flux/infrastructure/nas-tls/delivery >/dev/null",
  "kubectl kustomize kubernetes/flux/observability/nas-tls >/dev/null",
]

[tasks.shared-postgres-render]
description = "Render the pinned PostgreSQL chart and Flux trees without credentials."
run = "bash scripts/shared-postgres-render.sh"

[tasks.shared-postgres-bootstrap-check]
description = "Run synthetic Secret bootstrap safety tests without credentials."
run = "python3 scripts/test-shared-postgres-bootstrap.py"
