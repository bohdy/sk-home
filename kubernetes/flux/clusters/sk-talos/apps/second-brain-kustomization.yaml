# Stage only: activation requires published digests, secrets and live preflight.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: second-brain
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/apps/second-brain
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
    - name: storage-synology-csi
