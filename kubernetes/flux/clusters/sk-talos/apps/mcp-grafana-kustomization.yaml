# Staged independently so Grafana MCP can be activated only after its own
# image, token, tunnel, and viewer preflight are approved.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-grafana
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/apps/mcp-grafana
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
    - name: observability-metrics
