# Staged independently so Synology MCP remains stopped until certificate,
# identity, root, image, and tunnel preflights are approved.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-synology
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/apps/mcp-synology
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
