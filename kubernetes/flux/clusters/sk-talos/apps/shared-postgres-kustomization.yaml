# Activation follows reviewed Secret bootstrap, capacity checks and approval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-postgres
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./kubernetes/flux/apps/shared-postgres
  prune: true
  wait: true
  # Gate the dependent ACL Job on every instance and the current Database spec.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: >-
        has(status.readyInstances) &&
        status.readyInstances == spec.instances &&
        has(status.conditions) &&
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: >-
        has(status.applied) &&
        status.applied == true &&
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: shared-postgres-namespace
    - name: cloudnative-pg
    - name: storage-synology-csi
    - name: cilium
