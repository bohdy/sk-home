# Stage the NAS namespace, production DNS-01 Certificate, delivery policy, and
# reviewed reconciler inputs before any DSM credentialed workload is enabled.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nas-tls-issue
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/flux/infrastructure/nas-tls/issue
  prune: true
  wait: true
  dependsOn:
    - name: certificates
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
