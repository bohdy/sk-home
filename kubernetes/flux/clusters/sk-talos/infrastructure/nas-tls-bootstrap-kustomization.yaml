# This child owns only the reviewed unauthenticated fixed-endpoint path
# preflight. Apply it only after concrete explicit production approval for that
# path check; credentialed inspect/import, delivery, and monitoring stay gated.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nas-tls-bootstrap
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/flux/infrastructure/nas-tls/bootstrap
  prune: true
  wait: true
  dependsOn:
    - name: nas-tls-issue
  sourceRef:
    kind: GitRepository
    name: flux-system
