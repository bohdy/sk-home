# Recurring DSM delivery is separately gated after bootstrap read-back and
# target-id pinning have been accepted by the operator.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nas-tls-delivery
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/infrastructure/nas-tls/delivery
  prune: true
  wait: true
  dependsOn:
    - name: nas-tls-issue
    - name: nas-tls-bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system
