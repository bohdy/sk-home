# Dashboard provisioning depends on Grafana, its VictoriaMetrics datasource,
# and the flow collector DDL so the selected-host variable never queries before
# the repository-owned flow analytics view exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-dashboards
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/observability/dashboards
  dependsOn:
    - name: observability-metrics
    - name: observability-network-metrics
    - name: observability-flow-collector
