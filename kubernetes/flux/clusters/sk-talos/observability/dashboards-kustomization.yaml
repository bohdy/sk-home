# Dashboard provisioning waits for the metrics stack, network-metrics resources,
# and flow collector so dashboards query only after their data sources and the
# repository-owned flow analytics view are available.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-dashboards
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/observability/dashboards
  dependsOn:
    - name: observability-metrics
    - name: observability-network-metrics
    - name: observability-flow-collector
