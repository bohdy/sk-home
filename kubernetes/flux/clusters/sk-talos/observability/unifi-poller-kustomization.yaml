# The controller-metrics stage starts suspended so the operator can bootstrap
# the read-only viewer Secret before the workload is applied. Resume and
# reconcile this Kustomization after the Secret exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-unifi-poller
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/observability/unifi-poller
  prune: true
  # Keep the workload gated until its externally bootstrapped credentials exist.
  suspend: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability-metrics
    - name: unifi
