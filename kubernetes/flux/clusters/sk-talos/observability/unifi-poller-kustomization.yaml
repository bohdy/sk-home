# The controller-metrics stage is reconciled separately so the operator can
# bootstrap the read-only viewer Secret before the workload is applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-unifi-poller
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/flux/observability/unifi-poller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability-metrics
    - name: unifi
