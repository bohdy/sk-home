# UniFi poller provisioning depends on the metrics operator (for VMRule and
# VMStaticScrape CRDs), Cilium network policy enforcement, and DNS so the
# poller can reach the controller by hostname.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-unifi-poller
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  retryInterval: 2m
  path: ./kubernetes/flux/observability/unifi-poller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability-metrics
    - name: cilium
    - name: dns
