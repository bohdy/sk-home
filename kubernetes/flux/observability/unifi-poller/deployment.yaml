# The exporter is stateless and only needs one replica because Prometheus
# scrapes the controller cache directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: observability
  labels:
    app.kubernetes.io/name: unifi-poller
    app.kubernetes.io/component: controller-metrics
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-poller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-poller
        app.kubernetes.io/component: controller-metrics
        app.kubernetes.io/part-of: observability
    spec:
      automountServiceAccountToken: false
      serviceAccountName: unifi-poller
      # Public DNS for the canonical name points at Cloudflare. Keep this
      # collector on the private LAN LoadBalancer while preserving the
      # canonical hostname for TLS SNI and certificate verification.
      hostAliases:
        - ip: "10.1.30.56"
          hostnames:
            - "unifi.bohdal.name"
      containers:
        - name: unifi-poller
          image: ghcr.io/unpoller/unpoller:v5.1.0@sha256:4ead2ffec4ff53ffb8eea0a1d522b871e8024eac211d7321a74a61a6856d7e7d
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: unifi-poller-auth
          ports:
            - name: http
              containerPort: 9130
              protocol: TCP
          volumeMounts:
            # UnPoller reads its Docker configuration from /etc/unpoller/up.conf,
            # so the generated ConfigMap must land on the documented path.
            - name: config
              mountPath: /etc/unpoller/up.conf
              subPath: unifi-poller.conf
              readOnly: true
            # UnPoller may use the process temporary directory during normal
            # operation; keep that writable space bounded and in memory.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: config
          configMap:
            name: unifi-poller-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
