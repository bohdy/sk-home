# The exporter is stateless and only needs one replica because Prometheus
# scrapes the controller cache directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: observability
  labels:
    app.kubernetes.io/name: unifi-poller
    app.kubernetes.io/component: controller-metrics
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-poller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-poller
        app.kubernetes.io/component: controller-metrics
        app.kubernetes.io/part-of: observability
    spec:
      automountServiceAccountToken: false
      serviceAccountName: unifi-poller
      containers:
        - name: unifi-poller
          image: ghcr.io/unpoller/unpoller:v5.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: unifi-poller-auth
          ports:
            - name: http
              containerPort: 9130
              protocol: TCP
          volumeMounts:
            # UnPoller reads its Docker configuration from /etc/unpoller/up.conf,
            # so the generated ConfigMap must land on the documented path.
            - name: config
              mountPath: /etc/unpoller/up.conf
              subPath: unifi-poller.conf
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: unifi-poller-config
