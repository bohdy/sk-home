# UnPoller reads controller credentials from the unifi-poller-auth Secret via
# UP_UNIFI_DEFAULT_USER and UP_UNIFI_DEFAULT_PASS, so only the non-secret
# controller wiring lives here.
[poller]
debug = false
quiet = false
plugins = []

[prometheus]
disable = false
http_listen = "0.0.0.0:9130"
report_errors = true
dead_ports = false
interval = "60s"

[unifi]
dynamic = false

[unifi.defaults]
url = "https://unifi-console.unifi.svc.cluster.local:8443"
save_sites = true
hash_pii = false
save_rogue = false
save_speedtest = false
save_ids = false
save_events = false
save_alarms = false
save_anomalies = false
save_dpi = false
verify_ssl = false
timeout = "30s"
sites = ["all"]
