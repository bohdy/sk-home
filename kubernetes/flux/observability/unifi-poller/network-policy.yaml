# The exporter may only talk to the controller, kube-dns, and the VMAgent that
# scrapes it; that keeps the read-only account and controller cache contained.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-poller
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-poller
      io.cilium.k8s.policy.serviceaccount: unifi-poller
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: vmagent-metrics-victoria-metrics-k8s-stack
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9130"
              protocol: TCP
    # Kubelet probes may originate from the local or another cluster node.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9130"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: unifi.bohdal.name
    # The canonical hostname resolves to the LAN LoadBalancer VIP. Permit
    # only that Service-facing HTTPS tuple; the selected proxy endpoint rule
    # below remains necessary for Cilium's translated backend connection.
    - toCIDR:
        - 10.1.30.56/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unifi
            k8s:app.kubernetes.io/name: unifi-console-tls-proxy
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
