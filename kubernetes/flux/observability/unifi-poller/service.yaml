# Keep the poller cluster-internal; VMAgent is its only metrics consumer.
apiVersion: v1
kind: Service
metadata:
  name: unifi-poller
  namespace: observability
  labels:
    app.kubernetes.io/name: unifi-poller
    app.kubernetes.io/component: infrastructure-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unifi-poller
  ports:
    - name: http
      port: 9130
      targetPort: http
      protocol: TCP
