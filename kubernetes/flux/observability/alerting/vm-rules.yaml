# Local rules fill gaps in the reviewed chart defaults. Kubernetes, storage,
# resource, generic scrape, VMAlert, and Alertmanager health remain owned by the
# upstream rule set to avoid duplicate notifications.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-observability
  namespace: observability
spec:
  groups:
    - name: homelab-synthetic
      rules:
        - alert: BlackboxProbeFailed
          expr: probe_success{availability="always-on"} == 0
          for: 5m
          labels:
            severity: critical
            component: synthetic
          annotations:
            summary: Synthetic probe failed
            description: '{{ $labels.probe }} probe for {{ $labels.instance }} has failed for five minutes.'

    - name: homelab-vector
      rules:
        - alert: VectorSyslogThrottleDrops
          expr: |-
            sum by (cluster, site, component_id) (
              clamp_min(
                increase(vector_component_received_events_total{component_id=~"throttle_syslog_(tcp|udp)"}[5m])
                -
                increase(vector_component_sent_events_total{component_id=~"throttle_syslog_(tcp|udp)"}[5m]),
                0
              )
            ) > 0
          for: 2m
          labels:
            severity: warning
            component: vector
          annotations:
            summary: Syslog sender exceeded its flood allowance
            description: '{{ $labels.component_id }} has dropped events for at least two minutes.'

        - alert: VectorEventsDiscarded
          expr: |-
            sum by (cluster, site, component_id, host) (
              increase(vector_component_discarded_events_total[5m])
            ) > 0
          for: 2m
          labels:
            severity: warning
            component: vector
          annotations:
            summary: Vector discarded telemetry
            description: 'Vector component {{ $labels.component_id }} on {{ $labels.host }} is discarding events.'

        - alert: VectorBufferFilling
          expr: |-
            (
              vector_buffer_size_bytes{buffer_id="victoria_logs"}
              /
              vector_buffer_max_size_bytes{buffer_id="victoria_logs"}
            ) > 0.70
          for: 10m
          labels:
            severity: warning
            component: vector
          annotations:
            summary: Vector log buffer is filling
            description: 'The VictoriaLogs buffer on {{ $labels.host }} has remained above 70% for ten minutes.'

        - alert: VectorBufferNearlyFull
          expr: |-
            (
              vector_buffer_size_bytes{buffer_id="victoria_logs"}
              /
              vector_buffer_max_size_bytes{buffer_id="victoria_logs"}
            ) > 0.90
          for: 5m
          labels:
            severity: critical
            component: vector
          annotations:
            summary: Vector log buffer is nearly full
            description: 'The VictoriaLogs buffer on {{ $labels.host }} has remained above 90% for five minutes.'

    - name: homelab-flow
      # Flow collection is a single-replica pipeline, so every stage has a
      # direct signal: deployment availability for goflow2, its own processed
      # counter for records stopping, and the Vector sink error counter for
      # write failures. The records-stopped alert intentionally requires the
      # counter series to exist, so it does not double-report a down collector.
      rules:
        - alert: FlowCollectorDown
          expr: kube_deployment_status_replicas_available{namespace="observability",deployment="goflow2"} == 0
          for: 5m
          labels:
            severity: critical
            component: flow
          annotations:
            summary: Flow collector is unavailable
            description: goflow2 has not had an available replica for five minutes.

        - alert: FlowCollectorRecordsStopped
          expr: sum by (cluster, site) (increase(flow_process_nf_total[10m])) == 0
          for: 10m
          labels:
            severity: warning
            component: flow
          annotations:
            summary: No flow records received
            description: The goflow2 collector has processed no flow records for ten minutes.

        - alert: FlowCollectorWriteFailure
          expr: sum by (cluster, site) (increase(vector_component_errors_total{component_id="clickhouse_flows"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            component: flow
          annotations:
            summary: Flow records are not reaching ClickHouse
            description: The Vector ClickHouse sink has been reporting errors for at least two minutes.

    - name: homelab-victorialogs
      rules:
        - alert: VictoriaLogsRowsDropped
          expr: sum by (cluster, site) (increase(vl_rows_dropped_total[5m])) > 0
          for: 2m
          labels:
            severity: critical
            component: victorialogs
          annotations:
            summary: VictoriaLogs dropped ingested rows
            description: VictoriaLogs has reported dropped rows for at least two minutes.

        - alert: VictoriaLogsStorageReadOnly
          expr: vl_storage_is_read_only == 1
          for: 1m
          labels:
            severity: critical
            component: victorialogs
          annotations:
            summary: VictoriaLogs storage is read-only
            description: VictoriaLogs cannot persist new log data because storage is read-only.

    - name: homelab-flux
      rules:
        - alert: FluxReconciliationFailed
          expr: |-
            max by (cluster, site, kind, name, namespace) (
              gotk_reconcile_condition{type="Ready",status="False"}
            ) == 1
          for: 15m
          labels:
            severity: warning
            component: flux
          annotations:
            summary: Flux reconciliation remains failed
            description: '{{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for fifteen minutes.'

    - name: homelab-unifi
      # Use UnPoller's controller health metric so an intentionally absent
      # collector has no series and does not create a noisy alert.
      rules:
        - alert: UniFiPollerDown
          expr: unpoller_controller_up == 0
          for: 10m
          labels:
            severity: warning
            component: unifi
          annotations:
            summary: UniFi controller collection failed
            description: UniFi Poller has reported controller collection failure for ten minutes.

    - name: homelab-certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: |-
            (certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 60 * 60)
            and
            (certmanager_certificate_expiration_timestamp_seconds - time() > 0)
          for: 1h
          labels:
            severity: warning
            component: certificates
          annotations:
            summary: Certificate expires within fourteen days
            description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires within fourteen days.'

        - alert: CertificateExpiringSoon
          expr: |-
            (certmanager_certificate_expiration_timestamp_seconds - time() < 3 * 24 * 60 * 60)
            and
            (certmanager_certificate_expiration_timestamp_seconds - time() > 0)
          for: 15m
          labels:
            severity: critical
            component: certificates
          annotations:
            summary: Certificate expires within three days
            description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires within three days.'

    - name: homelab-ups
      # The USB APC is attached to Synology, which exposes its UPS MIB under
      # the existing Synology SNMP target rather than as a separate endpoint.
      rules:
        - alert: APCUPSOnBattery
          expr: upsInfoStatus{job="snmp-synology",instance="synology",upsInfoStatus="OB"} == 1
          for: 2m
          labels:
            severity: critical
            component: ups
          annotations:
            summary: APC UPS is running on battery
            description: The USB-connected APC UPS has remained on battery power for two minutes.

        - alert: APCUPSLowRuntime
          expr: upsBatteryRuntimeValue{job="snmp-synology",instance="synology"} < 600
          for: 2m
          labels:
            severity: critical
            component: ups
          annotations:
            summary: APC UPS runtime is below ten minutes
            description: The USB-connected APC UPS has had less than ten minutes of remaining runtime for two minutes.

    - name: homelab-smtp-relay
      # The exporter exposes queue state as a bounded histogram. Its first
      # bucket above the requested fifteen-minute threshold is 1,000 seconds,
      # so this warning is conservative by at most 100 seconds and cannot fire
      # early for a message in the 100-second bucket.
      rules:
        - alert: SmtpRelayQueueAgeHigh
          expr: |-
            max by (cluster, site) (
              histogram_quantile(
                1,
                sum by (cluster, site, le) (
                  postfix_showq_message_age_seconds_bucket{
                    queue=~"active|deferred|hold|incoming|maildrop"
                  }
                )
              )
            ) >= 1000
          for: 1m
          labels:
            severity: warning
            component: smtp-relay
          annotations:
            summary: SMTP relay queue is older than fifteen minutes
            description: The oldest queued message has crossed the exporter age threshold; inspect the relay queue and upstream delivery health.

        - alert: SmtpRelayPermanentDeliveryFailure
          expr: sum(increase(postfix_smtp_messages_processed_total{status="bounced"}[5m])) > 0
          labels:
            severity: warning
            component: smtp-relay
          annotations:
            summary: SMTP relay reported a permanent delivery failure
            description: Postfix has reported a permanent upstream delivery failure in the last five minutes.

        - alert: SmtpRelaySubmissionRateHigh
          expr: sum(increase(postfix_smtpd_messages_processed_total[1h])) > 5
          labels:
            severity: warning
            component: smtp-relay
          annotations:
            summary: SMTP relay submission rate is above five messages per hour
            description: The relay has accepted more than five submissions in the last hour.
