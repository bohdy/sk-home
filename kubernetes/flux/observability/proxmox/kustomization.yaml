# The exporter relies on the container's system trust store because Proxmox
# serves a browser-trusted ACME certificate for its canonical hostname.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - vm-service-scrape.yaml
  - vm-static-scrape.yaml
