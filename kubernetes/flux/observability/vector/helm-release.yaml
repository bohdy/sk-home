# Vector collects node-local Kubernetes container logs and forwards normalized
# JSON streams to the internal VictoriaLogs service.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: vector
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    role: Agent

    commonLabels:
      cluster: sk-talos
      site: sk

    # The kubernetes_logs source honors this annotation before reading files,
    # preventing Vector from ingesting its own operational logs.
    podAnnotations:
      vector.dev/exclude: "true"

    podLabels:
      vector.dev/exclude: "true"
      cluster: sk-talos
      site: sk

    # Talos kernel records do not include the service-log extraTags. Each node
    # targets its own hostPort, so the Downward API provides the stable identity
    # for records received by that node's Vector Agent.
    extraEnv:
      - name: VECTOR_SELF_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    nodeSelector:
      kubernetes.io/os: linux

    # Collection must cover control-plane container logs as well as the worker;
    # this tolerates the existing Talos control-plane scheduling taint only.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Each node gets an independent bounded retry buffer. Host persistence is
    # intentional because a DaemonSet cannot use one shared RWO claim.
    persistence:
      hostPath:
        enabled: true
        path: /var/lib/vector

    # Talos writes kube-apiserver audit JSON to this host directory. Mount only
    # the audit subtree, read-only, rather than broadening the existing log
    # mount contract.
    extraVolumes:
      - name: kubernetes-audit
        hostPath:
          path: /var/log/audit/kube
    extraVolumeMounts:
      - name: kubernetes-audit
        mountPath: /var/log/audit/kube
        readOnly: true

    containerPorts:
      - name: prom-exporter
        containerPort: 9598
        protocol: TCP
      - name: syslog-tcp
        containerPort: 514
        protocol: TCP
      - name: syslog-udp
        containerPort: 514
        protocol: UDP
      - name: talos-logs
        containerPort: 6051
        # Talos connects to its own management address, bypassing Kubernetes
        # Service load balancing so untagged kernel logs remain node-local.
        hostPort: 6051
        protocol: TCP

    service:
      enabled: false

    serviceHeadless:
      enabled: false

    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      sources:
        kubernetes_logs:
          type: kubernetes_logs
          # Current Vector source-side exclusion uses labels. Keep it for
          # collector self-exclusion; the transform below also supports the
          # design's annotation contract for arbitrary workloads.
          extra_label_selector: vector.dev/exclude!=true
        internal_metrics:
          type: internal_metrics
          scrape_interval_secs: 15
        # Raw socket sources preserve malformed input for the fallible parser
        # instead of dropping records that are not valid RFC syslog.
        syslog_tcp:
          type: socket
          address: 0.0.0.0:514
          mode: tcp
          decoding:
            codec: bytes
          framing:
            method: newline_delimited
          max_length: 262144
        syslog_udp:
          type: socket
          address: 0.0.0.0:514
          mode: udp
          decoding:
            codec: bytes
          max_length: 65507
        # Talos emits newline-delimited JSON over TCP. Keep bytes intact until
        # the remap transform so malformed input remains observable.
        talos_logs:
          type: socket
          address: 0.0.0.0:6051
          mode: tcp
          decoding:
            codec: bytes
          framing:
            method: newline_delimited
          max_length: 262144
        # Talos rotates one JSON-lines audit stream on each control-plane node.
        # Vector checkpoints file offsets in its existing node-local data_dir.
        kubernetes_audit:
          type: file
          include:
            # Follow the active file across rotation without backfilling Talos'
            # retained 100 MiB timestamped archives on first deployment.
            - /var/log/audit/kube/kube-apiserver.log
          read_from: beginning
          max_line_bytes: 1048576
      transforms:
        # The goflow2 collector is deliberately NOT excluded from container-log
        # collection: its NDJSON flow records travel on stdout and must be read
        # here. The route picks out that single stream; everything else,
        # including goflow2's own stderr diagnostics, continues unchanged to
        # the normal VictoriaLogs path.
        route_flows:
          type: route
          inputs:
            - kubernetes_logs
          route:
            flows: '.kubernetes.container_name == "flow" && .stream == "stdout"'
        exclude_annotated:
          type: filter
          inputs:
            - route_flows._unmatched
          condition: .kubernetes.pod_annotations."vector.dev/exclude" != "true"
        normalize_kubernetes:
          type: remap
          inputs:
            - exclude_annotated
          source: |
            .cluster = "sk-talos"
            .site = "sk"
            .source_type = "kubernetes"
            .received_at = now()
            .sender_timestamp = .timestamp
            .namespace = .kubernetes.pod_namespace
            .pod = .kubernetes.pod_name
            .container = .kubernetes.container_name
            .node = .kubernetes.pod_node_name
            .workload = .kubernetes.pod_owner
        # goflow2 emits one JSON object per line on stdout. Parse it into
        # top-level fields matching the committed flows.flow schema and strip
        # the container-log metadata the schema does not own so the JSONEachRow
        # payload stays lean. Unparsed lines are kept with parse_status and
        # parse_error instead of being dropped; skip_unknown_fields on the
        # sink lets those rows land with null flow columns for post-hoc triage.
        parse_flow:
          type: remap
          inputs:
            - route_flows.flows
          source: |
            received_at = now()
            raw_message = to_string(.message) ?? encode_json(.message)
            parsed, parse_error = parse_json(raw_message)

            if parse_error == null && is_object(parsed) {
              . = merge(., object!(parsed))
              .parse_status = "parsed"
            } else {
              .parse_status = "unparsed"
              .parse_error = if parse_error == null {
                "Flow record is not a JSON object"
              } else {
                to_string(parse_error)
              }
            }

            .cluster = "sk-talos"
            .site = "sk"
            .source_type = "ipfix"
            .received_at = received_at
            .timestamp = received_at

            del(.message)
            del(.kubernetes)
            del(.file)
            del(.stream)
        # Bound each sender independently at ten times the initial planning
        # rate. Do not emit sender keys on discard metrics because arbitrary
        # source addresses would create attacker-controlled cardinality.
        throttle_syslog_tcp:
          type: throttle
          inputs:
            - syslog_tcp
          # The chart evaluates customConfig through Helm tpl, so emit the
          # braces as a quoted string for Vector's own template parser.
          key_field: '{{ "{{ host }}" }}'
          threshold: 1000
          window_secs: 1
          internal_metrics:
            emit_events_discarded_per_key: false
        throttle_syslog_udp:
          type: throttle
          inputs:
            - syslog_udp
          key_field: '{{ "{{ host }}" }}'
          threshold: 1000
          window_secs: 1
          internal_metrics:
            emit_events_discarded_per_key: false
        parse_syslog_tcp:
          type: remap
          inputs:
            - throttle_syslog_tcp
          source: |
            .transport = "tcp"
            .raw_message = to_string(.message) ?? encode_json(.message)
            parsed, parse_error = parse_syslog(.raw_message)
            if parse_error == null {
              . = merge(., parsed)
              .parse_status = "parsed"
            } else {
              .parse_status = "unparsed"
              .parse_error = to_string(parse_error)
            }
        parse_syslog_udp:
          type: remap
          inputs:
            - throttle_syslog_udp
          source: |
            .transport = "udp"
            .raw_message = to_string(.message) ?? encode_json(.message)
            parsed, parse_error = parse_syslog(.raw_message)
            if parse_error == null {
              . = merge(., parsed)
              .parse_status = "parsed"
            } else {
              .parse_status = "unparsed"
              .parse_error = to_string(parse_error)
            }
        normalize_syslog:
          type: remap
          inputs:
            - parse_syslog_tcp
            - parse_syslog_udp
          source: |
            .cluster = "sk-talos"
            .site = "sk"
            .source_type = "syslog"
            .received_at = now()
            .sender = if exists(.host) { to_string!(.host) } else { "unknown" }
            .sender_timestamp = .timestamp
            .timestamp = .received_at
            .device = if exists(.hostname) { to_string!(.hostname) } else { .sender }
        parse_talos:
          type: remap
          inputs:
            - talos_logs
          source: |
            received_at = .timestamp
            sender = if exists(.host) { to_string!(.host) } else { "unknown" }
            collector_node = get_env_var("VECTOR_SELF_NODE_NAME") ?? sender
            raw_message = to_string(.message) ?? encode_json(.message)
            parsed, parse_error = parse_json(raw_message)

            if parse_error == null && is_object(parsed) {
              . = merge(., object!(parsed))
              .parse_status = "parsed"
            } else {
              .parse_status = "unparsed"
              .parse_error = if parse_error == null {
                "Talos record is not a JSON object"
              } else {
                to_string(parse_error)
              }
            }

            .cluster = "sk-talos"
            .site = "sk"
            .source_type = "talos"
            .transport = "tcp"
            .raw_message = raw_message
            .received_at = received_at
            .sender = sender
            .device = if exists(.node) { to_string!(.node) } else { collector_node }
            .talos_stream = if .parse_status == "unparsed" {
              "unknown"
            } else if exists(."talos-service") {
              "service"
            } else {
              "kernel"
            }
            if exists(."talos-service") {
              .service = to_string!(."talos-service")
            } else {
              del(.service)
            }
            if exists(."talos-level") {
              .severity = to_string!(."talos-level")
            } else {
              del(.severity)
            }
            .message = if exists(.msg) { to_string!(.msg) } else { raw_message }

            sender_timestamp, timestamp_error = parse_timestamp(to_string(."talos-time") ?? "", format: "%+")
            if timestamp_error == null {
              .sender_timestamp = sender_timestamp
            }
            .timestamp = received_at
        normalize_kubernetes_audit:
          type: remap
          inputs:
            - kubernetes_audit
          source: |
            received_at = now()
            collector_node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
            raw_message = to_string(.message) ?? encode_json(.message)
            parsed, parse_error = parse_json(raw_message)

            if parse_error == null && is_object(parsed) {
              . = merge(., object!(parsed))
              .parse_status = "parsed"
              .sensitive_fields_removed = exists(.requestObject) || exists(.responseObject)
              del(.requestObject)
              del(.responseObject)
              del(.message)
            } else {
              .parse_status = "unparsed"
              .parse_error = if parse_error == null {
                "Kubernetes audit record is not a JSON object"
              } else {
                to_string(parse_error)
              }
              # An unparseable payload cannot be scrubbed safely.
              .message = "Unparseable Kubernetes audit record omitted"
            }

            .cluster = "sk-talos"
            .site = "sk"
            .source_type = "kubernetes_audit"
            .node = collector_node
            .received_at = received_at
            if .parse_status == "parsed" {
              .audit_stage = to_string(.stage) ?? "unknown"
              .verb = to_string(.verb) ?? "unknown"
              .namespace = to_string(.objectRef.namespace) ?? ""
              .resource = to_string(.objectRef.resource) ?? ""
              .resource_name = to_string(.objectRef.name) ?? ""
              .username = to_string(.user.username) ?? "unknown"
              .impersonated_username = to_string(.impersonatedUser.username) ?? ""
              .response_code = to_int(.responseStatus.code) ?? 0
              sender_timestamp, timestamp_error = parse_timestamp(to_string(.stageTimestamp) ?? "", format: "%+")
              if timestamp_error == null {
                .sender_timestamp = sender_timestamp
              }
              .message = encode_json(.)
            }
            .timestamp = received_at
      # Unit tests exercise the normalization contract without opening sockets
      # or depending on the live VictoriaLogs backend.
      tests:
        - name: route goflow2 flow stdout to the ClickHouse path
          inputs:
            - insert_at: route_flows
              type: log
              log_fields:
                kubernetes:
                  container_name: flow
                stream: stdout
          outputs:
            - extract_from: route_flows.flows
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.kubernetes.container_name, "flow")
                    assert_eq!(.stream, "stdout")
        - name: route every other container stream to the unmatched path
          inputs:
            - insert_at: route_flows
              type: log
              log_fields:
                kubernetes:
                  container_name: vector
                stream: stderr
          outputs:
            - extract_from: route_flows._unmatched
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.kubernetes.container_name, "vector")
        - name: parse goflow2 flow JSON
          inputs:
            - insert_at: parse_flow
              type: log
              log_fields:
                kubernetes:
                  container_name: flow
                message: '{"type":"IPFIX","time_received_ns":1787500000000000000,"sampler_address":"10.1.20.1","bytes":1420,"packets":1,"src_addr":"10.21.162.142","dst_addr":"93.184.216.34","etype":"IPv4","proto":"TCP","src_port":443,"dst_port":54432,"in_if":8,"out_if":9,"flow_direction":0,"tcp_flags":24}'
                stream: stdout
          outputs:
            - extract_from: parse_flow
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "parsed")
                    assert_eq!(.source_type, "ipfix")
                    assert_eq!(.cluster, "sk-talos")
                    assert_eq!(.site, "sk")
                    assert_eq!(.src_addr, "10.21.162.142")
                    assert_eq!(.dst_addr, "93.184.216.34")
                    assert_eq!(.proto, "TCP")
                    assert_eq!(.etype, "IPv4")
                    assert_eq!(.src_port, 443)
                    assert_eq!(.sampler_address, "10.1.20.1")
                    assert!(is_timestamp(.timestamp))
                    assert!(!exists(.kubernetes))
                    assert!(!exists(.message))
        - name: retain malformed flow JSON
          inputs:
            - insert_at: parse_flow
              type: log
              log_fields:
                message: "not-json"
          outputs:
            - extract_from: parse_flow
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "unparsed")
                    assert!(exists(.parse_error))
        - name: normalize Talos service log
          inputs:
            - insert_at: parse_talos
              type: log
              log_fields:
                host: 10.1.20.41
                message: '{"msg":"service marker","node":"sk-talos-cp-1","talos-level":"info","talos-service":"machined","talos-time":"2026-07-17T20:00:00Z"}'
                timestamp: "2026-07-17T20:00:01Z"
          outputs:
            - extract_from: parse_talos
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "parsed")
                    assert_eq!(.talos_stream, "service")
                    assert_eq!(.source_type, "talos")
                    assert_eq!(.sender, "10.1.20.41")
                    assert_eq!(.device, "sk-talos-cp-1")
                    assert_eq!(.service, "machined")
                    assert_eq!(.severity, "info")
                    assert_eq!(.message, "service marker")
                    assert!(is_timestamp(.sender_timestamp))
        - name: normalize Talos kernel log
          inputs:
            - insert_at: parse_talos
              type: log
              log_fields:
                host: 10.1.20.42
                message: '{"msg":"kernel marker","talos-level":"warning","talos-time":"2026-07-17T20:00:00Z"}'
                timestamp: "2026-07-17T20:00:01Z"
          outputs:
            - extract_from: parse_talos
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "parsed")
                    assert_eq!(.talos_stream, "kernel")
                    assert_eq!(.sender, "10.1.20.42")
                    assert_eq!(.device, "vector-test-node")
                    assert_eq!(.message, "kernel marker")
        - name: retain malformed Talos log
          inputs:
            - insert_at: parse_talos
              type: log
              log_fields:
                host: 10.1.20.43
                message: "not-json"
                timestamp: "2026-07-17T20:00:01Z"
          outputs:
            - extract_from: parse_talos
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "unparsed")
                    assert_eq!(.talos_stream, "unknown")
                    assert_eq!(.raw_message, "not-json")
                    assert_eq!(.message, "not-json")
                    assert!(exists(.parse_error))
        - name: scrub Kubernetes audit bodies
          inputs:
            - insert_at: normalize_kubernetes_audit
              type: log
              log_fields:
                message: '{"apiVersion":"audit.k8s.io/v1","kind":"Event","level":"RequestResponse","auditID":"test-audit-id","stage":"ResponseComplete","requestURI":"/api/v1/namespaces/default/secrets/example","verb":"get","user":{"username":"acceptance-user"},"impersonatedUser":{"username":"system:serviceaccount:default:reader"},"objectRef":{"resource":"secrets","namespace":"default","name":"example"},"responseStatus":{"code":200},"requestObject":{"data":{"password":"top-secret"}},"responseObject":{"data":{"password":"top-secret"}},"stageTimestamp":"2026-07-20T20:00:00Z"}'
          outputs:
            - extract_from: normalize_kubernetes_audit
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "parsed")
                    assert_eq!(.source_type, "kubernetes_audit")
                    assert_eq!(.node, "vector-test-node")
                    assert_eq!(.resource, "secrets")
                    assert_eq!(.username, "acceptance-user")
                    assert_eq!(.impersonated_username, "system:serviceaccount:default:reader")
                    assert_eq!(.response_code, 200)
                    assert_eq!(.sensitive_fields_removed, true)
                    assert!(!exists(.requestObject))
                    assert!(!exists(.responseObject))
                    assert!(!contains(to_string!(.message), "top-secret"))
        - name: omit malformed Kubernetes audit payload
          inputs:
            - insert_at: normalize_kubernetes_audit
              type: log
              log_fields:
                message: 'not-json-with-top-secret'
          outputs:
            - extract_from: normalize_kubernetes_audit
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(.parse_status, "unparsed")
                    assert_eq!(.message, "Unparseable Kubernetes audit record omitted")
                    assert!(!contains(to_string!(.message), "top-secret"))
                    assert!(exists(.parse_error))
      sinks:
        victoria_logs:
          type: http
          inputs:
            - normalize_kubernetes
            - normalize_syslog
            - parse_talos
            - normalize_kubernetes_audit
          uri: http://victoria-logs.observability.svc.cluster.local.:9428/insert/jsonline?_stream_fields=cluster,site,source_type,namespace,workload,pod,container,node,device,facility,severity,transport,talos_stream,service&_time_field=timestamp&_msg_field=message
          method: post
          compression: gzip
          encoding:
            codec: json
          framing:
            method: newline_delimited
          batch:
            max_bytes: 1048576
            timeout_secs: 2
          buffer:
            type: disk
            max_size: 1073741824
            when_full: block
          request:
            retry_initial_backoff_secs: 1
            timeout_secs: 30
          healthcheck:
            enabled: true
        # Flow records land in the repository-owned flows.flow table. The
        # ClickHouse server drops fields it does not know (skip_unknown_fields),
        # so a schema in review never breaks inserts. Disk buffering matches
        # the VictoriaLogs sink so a ClickHouse outage degrades to retries
        # instead of dropping records.
        clickhouse_flows:
          type: clickhouse
          inputs:
            - parse_flow
          endpoint: http://clickhouse.observability.svc.cluster.local:8123
          database: flows
          table: flow
          format: json_each_row
          skip_unknown_fields: true
          compression: gzip
          batch:
            max_bytes: 1048576
            timeout_secs: 5
          buffer:
            type: disk
            max_size: 268435456
            when_full: block
          request:
            retry_initial_backoff_secs: 1
            timeout_secs: 30
          healthcheck:
            enabled: true
        prometheus_metrics:
          type: prometheus_exporter
          inputs:
            - internal_metrics
          address: 0.0.0.0:9598

    # DAC_READ_SEARCH is the capability Talos documents for reading audit files
    # written by the kube-apiserver nobody user. No write capability is added.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - DAC_READ_SEARCH
        drop:
          - ALL
      readOnlyRootFilesystem: true
      # The official image declares UID 0, and the Agent must write its
      # node-local hostPath checkpoint and disk-buffer directory.
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault
