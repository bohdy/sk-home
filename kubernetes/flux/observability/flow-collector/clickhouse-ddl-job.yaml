# Applies the repository-owned schema before any writer inserts rows. The
# container waits for the server's /ping, then POSTs each single-statement DDL
# file through ClickHouse's HTTP interface because that endpoint rejects
# multi-statement requests. The flow analytics view is created immediately
# after the base table so dashboard queries share one internal-network policy.
# The geo tables and dictionary are created before the separate GeoIP refresh
# workload starts importing data.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-ddl
  namespace: observability
  labels:
    app.kubernetes.io/name: clickhouse-ddl
    app.kubernetes.io/component: flow-collection
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-ddl
        app.kubernetes.io/component: flow-collection
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: clickhouse-client
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              until wget -q -O- http://clickhouse.observability.svc.cluster.local:8123/ping | grep -q "Ok."; do
                echo "waiting for clickhouse" >&2
                sleep 3
              done
              apply_ddl() {
                ddl="$1"
                echo "Applying ${ddl}" >&2
                wget -qO- --post-file="/ddl/${ddl}" "http://clickhouse.observability.svc.cluster.local:8123/" >&2
              }

              echo "ClickHouse ready, applying database and table DDL" >&2
              apply_ddl clickhouse-database.sql
              apply_ddl clickhouse-init.sql
              apply_ddl clickhouse-flow-analytics.sql
              apply_ddl clickhouse-geo-blocks-active.sql
              apply_ddl clickhouse-geo-blocks-candidate.sql
              apply_ddl clickhouse-geo-locations-active.sql
              apply_ddl clickhouse-geo-locations-candidate.sql
              apply_ddl clickhouse-geo-policy-table.sql
              apply_ddl clickhouse-geo-policy-clear.sql
              apply_ddl clickhouse-geo-policy-seed.sql
              apply_ddl clickhouse-geo-settings-table.sql
              apply_ddl clickhouse-geo-settings-clear.sql
              apply_ddl clickhouse-geo-settings-seed.sql
              apply_ddl clickhouse-geo-view.sql
              apply_ddl clickhouse-geo-dictionary.sql
              echo "DDL applied" >&2
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ddl
              mountPath: /ddl
              readOnly: true
      volumes:
        - name: ddl
          configMap:
            name: clickhouse-ddl
