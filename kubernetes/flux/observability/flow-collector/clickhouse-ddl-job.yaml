# Applies the repository-owned schema before any writer inserts rows. The
# container waits for the server's /ping, then POSTs the DDL via the HTTP
# interface. The clickhouse-client binary in the distroless image does not
# support --query-file, so busybox wget delivers the SQL directly.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-ddl
  namespace: observability
  labels:
    app.kubernetes.io/name: clickhouse-ddl
    app.kubernetes.io/component: flow-collection
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-ddl
        app.kubernetes.io/component: flow-collection
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: clickhouse-client
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              until wget -q -O- http://clickhouse.observability.svc.cluster.local:8123/ping | grep -q "Ok."; do
                echo "waiting for clickhouse" >&2
                sleep 3
              done
              echo "ClickHouse ready, applying DDL" >&2
              wget -qO- --post-file=/ddl/clickhouse-init.sql "http://clickhouse.observability.svc.cluster.local:8123/" >&2
              echo "DDL applied" >&2
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ddl
              mountPath: /ddl
              readOnly: true
      volumes:
        - name: ddl
          configMap:
            name: clickhouse-ddl
