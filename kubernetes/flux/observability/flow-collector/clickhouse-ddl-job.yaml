# Applies the repository-owned schema before any writer inserts rows. The Job
# is idempotent (IF NOT EXISTS) and never needs to rerun; the init container
# waits for the server's /ping so a cold start on a fresh PVC does not exhaust
# the retry budget. The SQL ships in the clickhouse-ddl ConfigMap generated by
# kustomization so schema changes stay reviewable and hash-versioned.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-ddl
  namespace: observability
  labels:
    app.kubernetes.io/name: clickhouse-ddl
    app.kubernetes.io/component: flow-collection
spec:
  backoffLimit: 4
  # Keep the finished pod around for post-mortem inspection, then let the
  # Job controller garbage-collect it automatically.
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-ddl
        app.kubernetes.io/component: flow-collection
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        # The service does not resolve until ClickHouse accepts connections;
        # busybox wget against /ping is the same signal the Deployment probes use.
        - name: wait-for-clickhouse
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              until wget -q -O- http://clickhouse.observability.svc.cluster.local:8123/ping | grep -q "Ok."; do
                echo "waiting for clickhouse" >&2
                sleep 3
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: clickhouse-client
          # The distroless image keeps the multicall clickhouse binary, so the
          # client subcommand shares the server's pinned digest exactly.
          image: clickhouse/clickhouse-server:26.7.2.59-distroless@sha256:38bfbc900cb54ab66bb8c6e8207325f4b27d6b04b3736c113f22dba16e6fb379
          command:
            - /usr/bin/clickhouse
          args:
            - client
            - --host=clickhouse.observability.svc.cluster.local
            - --port=8123
            - --multiquery
            - --query-file=/ddl/clickhouse-init.sql
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ddl
              mountPath: /ddl
              readOnly: true
      volumes:
        - name: ddl
          configMap:
            name: clickhouse-ddl
