# Retained claim so flow data survives routine workload rollouts and Flux
# suspension; deleting the LUN is a deliberate operational act, not a side
# effect of reconciliation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: observability
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: flow-collection
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 100Gi
