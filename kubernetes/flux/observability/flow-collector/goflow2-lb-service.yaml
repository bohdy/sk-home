# Cilium advertises the reserved IPFIX VIP over BGP. Cluster traffic policy
# forwards the gateway's UDP stream to the active collector pod regardless of
# which worker hosts it; the fixed NodePort remains available for diagnostics.
apiVersion: v1
kind: Service
metadata:
  name: goflow2
  namespace: observability
  labels:
    app.kubernetes.io/name: goflow2
    app.kubernetes.io/component: flow-collection
  annotations:
    lbipam.cilium.io/ips: "10.1.30.57"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: goflow2
  ports:
    - name: netflow-udp
      port: 2055
      targetPort: netflow-udp
      nodePort: 31236
      protocol: UDP
