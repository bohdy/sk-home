# Cilium advertises the reserved IPFIX VIP over BGP, but external VXLAN
# forwarding from the CP nodes to the worker is unreliable in the current Talos
# veth Cilium mode. The MikroTik target therefore uses the pinned NodePort on
# worker-1's physical address; the VIP remains available for future acceptance.
apiVersion: v1
kind: Service
metadata:
  name: goflow2
  namespace: observability
  labels:
    app.kubernetes.io/name: goflow2
    app.kubernetes.io/component: flow-collection
  annotations:
    lbipam.cilium.io/ips: "10.1.30.57"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: goflow2
  ports:
    - name: netflow-udp
      port: 2055
      targetPort: netflow-udp
      nodePort: 31236
      protocol: UDP
