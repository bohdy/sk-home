# Generate the DDL script with a content hash and copy that generated name onto
# the Job. Every reviewed schema change therefore creates a new immutable Job;
# the SQL remains idempotent through IF NOT EXISTS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clickhouse-persistent-volume-claim.yaml
  - clickhouse-deployment.yaml
  - clickhouse-service.yaml
  - clickhouse-ddl-job.yaml
  - goflow2-deployment.yaml
  - goflow2-lb-service.yaml
  - goflow2-metrics-service.yaml
  - goflow2-vm-service-scrape.yaml
  - goflow2-network-policy.yaml
  - clickhouse-network-policy.yaml
configMapGenerator:
  - name: clickhouse-ddl
    namespace: observability
    files:
      - clickhouse-database.sql
      - clickhouse-init.sql
generatorOptions:
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: flow-collection
configurations:
  - kustomizeconfig.yaml
