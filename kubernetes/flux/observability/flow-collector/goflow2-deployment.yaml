# goflow2 ingests IPFIX from the MikroTik gateway as a single stateless
# replica: UDP/2055 is the only collector input, and records are emitted as
# NDJSON on stdout for the existing Vector kubernetes_logs pipeline to route.
# The container name "flow" is load-bearing: the Vector route transform keys
# on .kubernetes.container_name == "flow" plus stream == "stdout".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goflow2
  namespace: observability
  labels:
    app.kubernetes.io/name: goflow2
    app.kubernetes.io/component: flow-collection
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: goflow2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goflow2
        app.kubernetes.io/component: flow-collection
    spec:
      automountServiceAccountToken: false
      # Prefer a general-purpose worker without making it a hard dependency.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: flow
          # v2.2.6 has only file/stdout and kafka transports; an empty file
          # destination writes NDJSON to stdout. amd64 manifest digest verified
          # against the multi-arch OCI index.
          image: ghcr.io/netsampler/goflow2:v2.2.6@sha256:9971fb4c08adbe6519d5da38f14d3a0eefcc3c0d88cb2e49ab4c6415e99d32a0
          args:
            - -listen=netflow://:2055
            - -format=json
            - -transport=file
            - -addr=:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: netflow-udp
              containerPort: 2055
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
