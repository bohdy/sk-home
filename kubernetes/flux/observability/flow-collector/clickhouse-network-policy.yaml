# ClickHouse serves only the in-cluster writer (Vector), the Grafana datasource,
# and the one-shot DDL Job; egress is denied entirely because the server makes
# no outbound connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vector
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse-ddl
      ports:
        - port: 8123
          protocol: TCP
  # Empty egress rules with the Egress policy type deny all outbound traffic.
  egress: []
---
# The DDL Job resolves the clickhouse Service name and connects to it over
# HTTP; it needs DNS and the server port and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ddl
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-ddl
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - port: 8123
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
