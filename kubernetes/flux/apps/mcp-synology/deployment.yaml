# One tunnel-client process owns one read-only Synology MCP child. There is no
# Service or ingress because the tunnel is outbound-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-synology
  namespace: mcp-synology
  labels:
    app.kubernetes.io/name: mcp-synology
    app.kubernetes.io/component: mcp-runtime
spec:
  # Stage namespace/policy before Secret bootstrap; activation sets this to one.
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-synology
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-synology
        app.kubernetes.io/component: mcp-runtime
    spec:
      serviceAccountName: mcp-synology
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: tunnel-client
          image: ghcr.io/bohdy/sk-home-mcp-synology:activation-required
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tunnel-client
          args:
            - run
            - --config
            - /etc/mcp/tunnel-client.yaml
          env:
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-synology-credentials
                  key: control-plane-api-key
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom:
                configMapKeyRef:
                  name: mcp-synology-config
                  key: control-plane-tunnel-id
            - name: SYNOLOGY_ORIGIN
              value: https://nas.bohdal.name:5001
            - name: SYNOLOGY_REAL_ROOT
              value: /volume1/Media
            - name: SYNOLOGY_SHARE_NAME
              value: Media
            - name: SYNOLOGY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcp-synology-credentials
                  key: synology-username
            - name: SYNOLOGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-synology-credentials
                  key: synology-password
            - name: DO_NOT_TRACK
              value: "1"
          startupProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - --show-error
                - http://127.0.0.1:8080/healthz
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - --show-error
                - http://127.0.0.1:8080/readyz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - --show-error
                - http://127.0.0.1:8080/healthz
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/mcp
              readOnly: true
            - name: runtime
              mountPath: /run/tunnel-client
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mcp-synology-config
            items:
              - key: tunnel-client.yaml
                path: tunnel-client.yaml
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
