# Staged images cannot start until the activation review replaces these tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - persistent-volume-claims.yaml
  - database.yaml
  - application.yaml
  - services.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/bohdy/brain-backend
    newTag: activation-required
  - name: ghcr.io/bohdy/brain-web
    newTag: activation-required
  - name: ghcr.io/bohdy/brain-db
    newTag: activation-required
