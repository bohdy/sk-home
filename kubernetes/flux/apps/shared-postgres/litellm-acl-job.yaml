# Versioned owner-run ACL reconciliation complements CNPG role management.
# A reviewed ACL change must bump the Job revision; no administrator is exposed.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-acl-v1
  namespace: postgres
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-acl
        app.kubernetes.io/instance: litellm
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-acl
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:99bc64e413d59b017d169ce2ff25746f1d68c5d7210a19f12c0464a109216ee1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: PGHOST
              value: shared-postgres-rw.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: litellm
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres-auth
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres-auth
                  key: password
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
          command:
            - /bin/sh
            - -ec
            - |
              # Never echo credentials, connection arguments or SQL error payloads.
              if ! psql -X -v ON_ERROR_STOP=1 >/dev/null 2>&1 <<'SQL'
              BEGIN;
              REVOKE ALL ON DATABASE litellm FROM PUBLIC;
              GRANT CONNECT ON DATABASE litellm TO litellm;
              REVOKE ALL ON SCHEMA public FROM PUBLIC;
              GRANT USAGE, CREATE ON SCHEMA public TO litellm;
              COMMIT;
              SQL
              then
                echo "ACL reconciliation failed" >&2
                exit 1
              fi
              echo "ACL reconciliation succeeded"
