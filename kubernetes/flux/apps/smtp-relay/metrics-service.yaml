# VictoriaMetrics scrapes the exporter through a separate ClusterIP so the
# public/private SMTP Service cannot accidentally expose the metrics port.
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay-metrics
  namespace: smtp-relay
  labels:
    app.kubernetes.io/name: smtp-relay
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smtp-relay
  ports:
    - name: metrics
      port: 9154
      targetPort: metrics
      protocol: TCP
