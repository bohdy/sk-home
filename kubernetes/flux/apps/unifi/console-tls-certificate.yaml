# DNS-01 validation proves ownership without making the LAN VIP reachable from
# the Internet. cert-manager rotates this Secret independently of the proxy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi-console
  namespace: unifi
spec:
  secretName: unifi-console-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - unifi.bohdal.name
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
