# The controller accepts node-originated console checks and LAN device traffic
# only on UniFi's inform, STUN, discovery, and explicitly authorized console
# paths. Cloudflare Access remains the public perimeter; the LAN VIP admits
# only private source ranges before Cilium proxies traffic to this Pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-controller-stage
  namespace: unifi
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-controller
  ingress:
    # Kubelet probes and kubectl port-forward traffic originate from nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # The in-cluster connector uses the private ClusterIP origin after
    # Cloudflare Access authenticates the Internet request at the edge.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel
            k8s:app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # The LAN TLS proxy has no device-management capability; it only relays
    # authenticated browser HTTPS requests to UniFi's native console listener.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unifi
            k8s:app.kubernetes.io/name: unifi-console-tls-proxy
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # LoadBalancer proxying presents LAN console traffic with Cilium's world
    # identity. The Service source-range policy above is the authoritative
    # 10.0.0.0/8 admission boundary for this particular path.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # Preserve the direct source-CIDR allowance for paths that reach the
    # endpoint without Cilium's per-node proxy translation.
    - fromCIDR:
        - 10.0.0.0/8
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "10001"
              protocol: UDP
    # Cluster LoadBalancer traffic forwarded through an advertising BGP node
    # reaches the backend with Cilium's `world` identity. The Service's explicit
    # source-range allow policy enforces the 10.0.0.0/8 boundary before this
    # backend rule, so accepting `world` here does not expose the VIP publicly.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "10001"
              protocol: UDP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unifi
            k8s:app.kubernetes.io/name: unifi-mongodb
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Make the resolver traffic visible to Cilium's DNS proxy. Permit
          # the internal MongoDB service and non-interactive UniFi service
          # names required below. The SSO lookup therefore fails immediately,
          # sending the UI to its local administrator fallback rather than a
          # blocked TCP flow.
          rules:
            dns:
              - matchName: unifi-mongodb.unifi.svc.cluster.local
              - matchName: trace.svc.ui.com
              - matchName: static.ui.com
    # The self-hosted Network application synchronously contacts UniFi service
    # endpoints while handling legacy local-login requests. Restrict that
    # compatibility path to the Ubiquiti domain over HTTPS rather than granting
    # the controller broad Internet egress. Use the exact observed service
    # names rather than a wildcard: this Cilium release does not apply the
    # wildcard selector to the multi-label trace host used during login.
    - toFQDNs:
        - matchName: trace.svc.ui.com
        - matchName: static.ui.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The proxy is the sole LAN TLS endpoint. It may resolve and relay only to the
# controller's ClusterIP service; it cannot reach device, database, or Internet
# endpoints. Cilium's Service source-range rule remains the LAN admission gate.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-console-tls-proxy
  namespace: unifi
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-console-tls-proxy
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unifi
            k8s:app.kubernetes.io/name: unifi-controller
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              # Cilium evaluates the canonical Kubernetes DNS query, including
              # its trailing dot, as a DNS pattern. This exact Service name
              # resolves only to the controller's private ClusterIP.
              - matchPattern: unifi-console.unifi.svc.cluster.local.
---
# MongoDB accepts only the controller and node-originated health probes. It has
# no egress requirements during this stage and remains unreachable externally.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-mongodb-stage
  namespace: unifi
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-mongodb
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unifi
            k8s:app.kubernetes.io/name: unifi-controller
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
