# This private service is the tunnel origin and keeps direct pod-to-console
# traffic inside the cluster. LAN clients use the separately constrained
# `unifi-console-lan` LoadBalancer rather than reaching this Service directly.
apiVersion: v1
kind: Service
metadata:
  name: unifi-console
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unifi-controller
  ports:
    - name: https-console
      port: 8443
      targetPort: https-console
      protocol: TCP
