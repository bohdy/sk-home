# Publish a trusted HTTPS console only on the dedicated LAN VIP. Cloudflare
# reaches the controller's separate ClusterIP origin, so this Service neither
# broadens the public boundary nor changes Cloudflare Access enforcement.
apiVersion: v1
kind: Service
metadata:
  name: unifi-console-lan
  namespace: unifi
  annotations:
    lbipam.cilium.io/ips: "10.1.30.56"
    # Cilium applies the source-range boundary before proxying to the Pod.
    service.cilium.io/src-ranges-policy: allow
  labels:
    app.kubernetes.io/name: unifi-controller
    app.kubernetes.io/component: console
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  loadBalancerSourceRanges:
    - 10.0.0.0/8
  selector:
    app.kubernetes.io/name: unifi-console-tls-proxy
  ports:
    # Preserve the standard HTTPS port for LAN browsers. The proxy terminates
    # the cert-manager certificate, then sends traffic to UniFi's native port.
    - name: https-console
      port: 443
      targetPort: https-console
      protocol: TCP
