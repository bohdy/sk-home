# Keep one connector available during voluntary maintenance; preferred
# anti-affinity provides node-level separation when schedulable capacity permits.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
