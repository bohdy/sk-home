# Daily reconciliation is enough for a 30-day renewal window and gives DSM
# restart/read-back failures a bounded retry budget without overlapping runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nas-tls-delivery
  namespace: nas-tls
  labels:
    app.kubernetes.io/name: nas-tls-delivery
    app.kubernetes.io/component: certificate-delivery
spec:
  # Rollback commits set this to true while the Flux child remains active so
  # the API receives the suspension before the child itself is suspended.
  suspend: false
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # A completed import followed by a failed read-back must remain a
      # visible failed Job; a retry could observe the new leaf and hide the
      # inventory/binding failure as a misleading no-op success.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nas-tls-delivery
            app.kubernetes.io/component: certificate-delivery
        spec:
          automountServiceAccountToken: false
          hostAliases:
            - ip: 10.1.100.10
              hostnames:
                - nas.bohdal.name
          # The reconciler already polls DSM within one bounded run.  Never
          # restart a process that may have completed an import before failing
          # its post-import verification.
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              # Verified against the official Docker Hub library/python OCI
              # index on 2026-10-03; the digest pins all supported platforms.
              image: docker.io/library/python:3.14.8-slim-bookworm@sha256:c8137f4c460908c8763f281c8f22c431eb5c538514ba9553fc3a89c06b7cfb88
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/python3
                - /app/nas_tls_reconciler.py
                - --config
                - /etc/nas-tls/config.json
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: reconciler
                  mountPath: /app
                  readOnly: true
                - name: reconciler-config
                  mountPath: /etc/nas-tls
                  readOnly: true
                - name: source-certificate
                  mountPath: /source
                  readOnly: true
                - name: dsm-auth
                  mountPath: /auth
                  readOnly: true
          volumes:
            - name: reconciler
              configMap:
                name: nas-tls-reconciler
                defaultMode: 0444
                items:
                  - key: nas_tls_reconciler.py
                    path: nas_tls_reconciler.py
            - name: reconciler-config
              configMap:
                name: nas-tls-reconciler-config
                defaultMode: 0444
                items:
                  - key: config.json
                    path: config.json
            - name: source-certificate
              secret:
                secretName: nas-tls
                defaultMode: 0440
                items:
                  - key: tls.crt
                    path: tls.crt
                  - key: tls.key
                    path: tls.key
            # Create this Secret from Bitwarden through the documented stdin
            # bootstrap step.  The CronJob receives neither the token nor any
            # secret in argv or environment variables.
            - name: dsm-auth
              secret:
                secretName: nas-tls-dsm-auth
                defaultMode: 0440
                items:
                  - key: username
                    path: username
                  - key: password
                    path: password
