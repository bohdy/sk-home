# The path preflight and reconciler identities have no ingress and can reach
# only the NAS DSM HTTPS endpoint. HostAliases avoids granting DNS egress to
# these workloads; the credentialed reconciler preserves canonical SNI and HTTP hostname.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nas-tls-delivery
  namespace: nas-tls
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nas-tls-delivery
  ingress: []
  egress:
    - toCIDR:
        - 10.1.100.10/32
      toPorts:
        - ports:
            - port: "5001"
              protocol: TCP
