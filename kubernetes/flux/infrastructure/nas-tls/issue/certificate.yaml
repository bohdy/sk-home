# DNS-01 issuance is independent of the NAS listener, so an expired or
# misnamed DSM certificate cannot block obtaining the replacement source.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nas-tls
  namespace: nas-tls
spec:
  secretName: nas-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - nas.bohdy.sk
    - nas.bohdal.name
  # Keep the renewal window explicit so the delivery CronJob has a full,
  # bounded period to observe a refreshed Secret before expiry.
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
