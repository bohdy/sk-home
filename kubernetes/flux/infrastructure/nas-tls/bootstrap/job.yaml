# Run only after the independently approved DSM bootstrap precondition is
# satisfied.  The Job uses the same strict reconciler as recurring delivery.
apiVersion: batch/v1
kind: Job
metadata:
  name: nas-tls-bootstrap
  namespace: nas-tls
  labels:
    app.kubernetes.io/name: nas-tls-delivery
    app.kubernetes.io/component: certificate-delivery
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nas-tls-delivery
        app.kubernetes.io/component: certificate-delivery
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 10.1.100.10
          hostnames:
            - nas.bohdal.name
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciler
          image: docker.io/library/python:3.14.8-slim-bookworm@sha256:c8137f4c460908c8763f281c8f22c431eb5c538514ba9553fc3a89c06b7cfb88
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/python3
            - /app/nas_tls_reconciler.py
            - --config
            - /etc/nas-tls/config.json
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: reconciler
              mountPath: /app
              readOnly: true
            - name: reconciler-config
              mountPath: /etc/nas-tls
              readOnly: true
            - name: source-certificate
              mountPath: /source
              readOnly: true
            - name: dsm-auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: reconciler
          configMap:
            name: nas-tls-reconciler
            defaultMode: 0444
            items:
              - key: nas_tls_reconciler.py
                path: nas_tls_reconciler.py
        - name: reconciler-config
          configMap:
            name: nas-tls-reconciler-config
            defaultMode: 0444
            items:
              - key: config.json
                path: config.json
        - name: source-certificate
          secret:
            secretName: nas-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        # The operator creates this Secret from the Bitwarden value through a
        # trusted stdin-only bootstrap procedure; no credential is committed.
        - name: dsm-auth
          secret:
            secretName: nas-tls-dsm-auth
            defaultMode: 0440
            items:
              - key: username
                path: username
              - key: password
                path: password
