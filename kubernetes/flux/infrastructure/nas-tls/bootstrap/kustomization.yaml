# This active bootstrap phase is limited to the approved unauthenticated path
# preflight. The credentialed inspect/import wrapper remains staged but inactive
# until a separate reviewed phase enables its versioned Job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - path-preflight-job.yaml
configMapGenerator:
  - name: nas-tls-path-preflight
    namespace: nas-tls
    files:
      - nas_tls_path_preflight.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: nas-tls-delivery
    app.kubernetes.io/component: certificate-path-preflight
