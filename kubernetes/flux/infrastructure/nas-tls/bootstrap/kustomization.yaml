# The wrapper is owned by this one-shot child and is mounted only by its
# inspect/import Job.  The strict reconciler remains issue-owned and shared by
# the recurring delivery path.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job.yaml
configMapGenerator:
  - name: nas-tls-bootstrap
    namespace: nas-tls
    files:
      - nas_tls_bootstrap.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: nas-tls-delivery
    app.kubernetes.io/component: certificate-delivery-bootstrap
