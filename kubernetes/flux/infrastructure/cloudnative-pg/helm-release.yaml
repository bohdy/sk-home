# CNPG 1.30 supports Kubernetes 1.36 and PostgreSQL 18. Operator/operand upgrades
# require explicit review; the digest also pins the instance-manager executable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: cloudnative-pg
    image:
      tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
    config:
      data:
        # Limit reconciliation to the shared service namespace.
        WATCH_NAMESPACE: postgres
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
