apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-zones
  namespace: dns-system
data:
  100.1.10.in-addr.arpa.zone: |
    $ORIGIN 100.1.10.in-addr.arpa.
    $TTL 300
    @ IN SOA dns.bohdal.name. hostmaster.bohdal.name. (
        2026090101 ; serial
        300        ; refresh
        120        ; retry
        1209600    ; expire
        60         ; negative cache TTL
    )
    @ IN NS  dns.bohdal.name.
    1 IN PTR gw.bohdal.name.
    10 IN PTR nas.bohdal.name.
    250 IN PTR printer.sk.bohdal.name.
    201 IN PTR pve.bohdal.name.
  30.1.10.in-addr.arpa.zone: |
    $ORIGIN 30.1.10.in-addr.arpa.
    $TTL 300
    @ IN SOA dns.bohdal.name. hostmaster.bohdal.name. (
        2026090101 ; serial
        300        ; refresh
        120        ; retry
        1209600    ; expire
        60         ; negative cache TTL
    )
    @  IN NS  dns.bohdal.name.
    53 IN PTR dns.bohdal.name.
    55 IN PTR grafana.bohdal.name.
    56 IN PTR unifi.bohdal.name.
    58 IN PTR smtp.internal.bohdal.name.
  bohdal.name.zone: |
    $ORIGIN bohdal.name.
    $TTL 300
    @ IN SOA dns.bohdal.name. hostmaster.bohdal.name. (
        2026090101 ; serial
        300        ; refresh
        120        ; retry
        1209600    ; expire
        60         ; negative cache TTL
    )
    @      IN NS dns.bohdal.name.
    dns    IN A  10.1.30.53
    blocky IN A  10.1.30.53
    grafana IN A 10.1.30.55
    grafana.internal IN A 10.1.30.55
    ; The printer-facing SMTP relay is reachable only through the private Cilium VIP.
    smtp.internal IN A 10.1.30.58
    ; The canonical console hostname resolves directly to the LAN-only HTTPS VIP.
    ; Public resolvers continue returning the proxied Cloudflare Tunnel record.
    unifi IN A 10.1.30.56
    gw     IN A  10.1.100.1
    ; The Synology NAS has a fixed infrastructure address on the management VLAN.
    nas    IN A  10.1.100.10
    ; Adopted UniFi devices persist the short `unifi` inform hostname and receive
    ; `ap.sk.bohdal.name` as their DHCP search domain.
    unifi.ap.sk IN A 10.1.30.1
    ; The Brother printer receives this address from the MikroTik DHCP reservation.
    printer.sk IN A  10.1.10.250
    ; Proxmox retains its short node name, while this canonical management alias
    ; and the legacy `pve.sk` alias are covered by one browser-trusted ACME certificate.
    pve    IN A  10.1.100.201
    pve.sk IN A  10.1.100.201
