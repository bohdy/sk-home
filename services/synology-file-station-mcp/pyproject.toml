[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-file-station-mcp"
version = "0.1.0"
description = "Bounded, read-only Synology File Station MCP adapter"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.3.0",
  "markitdown[pdf,docx,xlsx,pptx]==0.1.8",
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
]

[project.scripts]
synology-file-station-mcp = "synology_file_station_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synology_file_station_mcp*"]
exclude = ["tests*", "build*"]
